<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lieux — La Larme d'Argent</title>
<link rel="stylesheet" href="css/sw-v2.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;0,900;1,400&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>

/* ── PAGE HEADER ── */
.l-page-header { margin-bottom: 24px; }
.l-page-title {
  font-family: var(--font-ui); font-size: 1.45rem; font-weight: 700;
  color: var(--text); letter-spacing: .02em; margin-bottom: 3px;
}
.l-page-sub {
  font-family: var(--font-body); font-size: .82rem;
  font-style: italic; color: var(--text-muted);
}

/* ── FILTRES ── */
.l-filters { margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
.l-filters-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* Dropdown ville */
.l-select-wrap { position: relative; }
.l-select-wrap::after {
  content: '▾'; position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
  font-size: .65rem; color: var(--text-muted); pointer-events: none;
}
#ville-select {
  font-family: var(--font-ui); font-size: .7rem; font-weight: 600;
  letter-spacing: .04em; padding: 6px 30px 6px 14px;
  background: var(--surface); border: 1.5px solid var(--border-soft);
  border-radius: 20px; color: var(--text); outline: none; cursor: pointer;
  transition: border-color .14s; appearance: none; -webkit-appearance: none;
  min-width: 180px;
}
#ville-select:focus { border-color: var(--crimson-bd); }
#ville-select option { background: var(--surface); color: var(--text); }

/* Pills statut */
.filter-group { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-pill {
  font-family: var(--font-ui); font-size: .68rem; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  padding: 5px 13px; border-radius: 20px;
  border: 1.5px solid var(--border-soft);
  background: var(--surface); color: var(--text-muted);
  cursor: pointer; transition: all .14s; outline: none;
}
.filter-pill:hover { border-color: var(--border-mid); color: var(--text); background: var(--surface-mid); }
.filter-pill.active { background: var(--crimson); border-color: var(--text); color: var(--text); }

.search-input{padding:5px 14px;background:var(--surface);border:1px solid var(--border-soft);border-radius:20px;font-family:var(--font-body);font-size:.85rem;font-style:italic;color:var(--text);outline:none;transition:border-color .15s;margin-left:auto;}
.search-input::placeholder{color:var(--text-dim);}
.search-input:focus{border-color:var(--border-mid);}

/* Count */
.l-count {
  font-family: var(--font-ui); font-size: .58rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px;
}

/* ── GRILLE ── */
.lieux-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 12px; align-items: start;
}
.l-empty {
  grid-column: 1/-1; text-align: center; padding: 60px 20px;
  font-family: var(--font-ui); font-size: .75rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-dim);
}

/* ── CARTE LIEU ── */
.lieu-card {
  background: var(--surface); border-radius: 12px;
  box-shadow: var(--sh-card); overflow: hidden;
  animation: cardIn .3s ease both;
  transition: box-shadow .18s;
}
.lieu-card:hover { box-shadow: var(--sh-card-hov); }

/* ── EN-TÊTE CARTE ── */
.lieu-head {
  padding: 14px 16px 12px;
  display: flex; align-items: flex-start; gap: 11px;
  cursor: pointer; user-select: none;
}
.lieu-type-icon {
  width: 96px; height: 96px; border-radius: 18px;
  background: var(--surface-mid); border: 1px solid var(--border-soft);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 0;
  color: var(--text); padding: 14px; box-sizing: border-box; overflow: hidden;
}
.lieu-head-info { flex: 1; min-width: 0; }
.lieu-nom {
  font-family: var(--font-ui); font-size: .88rem; font-weight: 700;
  color: var(--text); letter-spacing: .02em; line-height: 1.25; margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lieu-region {
  font-family: var(--font-body); font-size: .78rem; font-style: italic; color: var(--text-muted);
}
.l-chip {
  font-family: var(--font-ui); font-size: .6rem; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase;
  padding: 2px 9px; border-radius: 20px; white-space: nowrap;
  border: 1.5px solid var(--border-soft); background: transparent; color: var(--text-muted);
  flex-shrink: 0; align-self: flex-start;
}
.l-chip.visite   { color: var(--text);        border-color: var(--border-mid); }
.l-chip.connu    { color: var(--text-muted);   border-color: var(--border-soft); }
.l-chip.inexplore{ color: var(--text-dim);     border-color: var(--border-soft); }
.l-chip.inconnu  { color: var(--text-dim);     border-color: var(--border-soft); }

.lieu-chevron {
  font-size: .6rem; color: var(--text-dim);
  transition: transform .2s; margin-top: 5px; flex-shrink: 0;
}
.lieu-card.open .lieu-chevron { transform: rotate(180deg); }

/* ── CORPS CARTE ── */
.lieu-div { height: 1px; background: var(--border-soft); margin: 0 16px; display: none; }
.lieu-card.open .lieu-div { display: block; }
.lieu-body { padding: 14px 16px 16px; display: none; }
.lieu-card.open .lieu-body { display: block; }

.lieu-desc {
  font-family: var(--font-body); font-size: .82rem; font-style: italic;
  color: var(--text-muted); line-height: 1.65; margin-bottom: 12px;
}

/* Bloc détails */
.lieu-details {
  background: var(--bg); border: 1px solid var(--border-soft);
  border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
}
.lieu-detail-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 7px; }
.lieu-detail-row:last-child { margin-bottom: 0; }
.lieu-detail-lbl {
  font-family: var(--font-ui); font-size: .52rem; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted);
  min-width: 90px; flex-shrink: 0; padding-top: 3px;
}
.chip-list { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  font-family: var(--font-body); font-size: .75rem; font-style: italic;
  color: var(--text-muted); padding: 1px 8px;
  border: 1px solid var(--border-soft); border-radius: 8px;
}

/* Bloc MJ */
.mj-block {
  border: 1.5px solid var(--crimson-bd); border-radius: 8px; padding: 10px 12px;
}
.mj-block-title {
  font-family: var(--font-ui); font-size: .52rem; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase; color: var(--text); margin-bottom: 6px;
}
.mj-block-txt {
  font-family: var(--font-body); font-size: .78rem; font-style: italic;
  color: var(--text-muted); line-height: 1.6;
}

@media(max-width:640px) {
  .search-input { margin-left: 0; width: 100%; }
  .lieux-grid { grid-template-columns: 1fr; }
}

</style>
</head>
<body>

<div class="l-page-header">
  <div class="page-title">Les <span>Lieux</span></div>
  <div class="page-sub">Emplacements connus dans les Marches du Souffle</div>
</div>

<div class="l-filters">
  <div class="l-filters-row">
    <div class="l-select-wrap">
      <select id="ville-select" onchange="setVilleFilter()">
        <option value="">Toutes les villes</option>
      </select>
    </div>
    <input class="search-input" type="text" id="search-input" placeholder="Rechercher un lieu…" oninput="applyFilters()">
  </div>
  <div class="l-filters-row">
    <div class="filter-group">
      <button class="filter-pill active" onclick="setStatutFilter('', this)">Tous</button>
      <button class="filter-pill" onclick="setStatutFilter('visité', this)">Visités</button>
      <button class="filter-pill" onclick="setStatutFilter('connu', this)">Connus</button>
      <button class="filter-pill mj-only" onclick="setStatutFilter('inexploré', this)">Inexplorés</button>
    </div>
  </div>
</div>

<div class="l-count" id="l-count"></div>
<div class="lieux-grid" id="lieux-grid">
  <p style="font-style:italic;color:var(--text-dim);font-size:.82rem;grid-column:1/-1;text-align:center;padding:24px;">Chargement…</p>
</div>

<script src="js/storage.js"></script>
<script src="js/nav-v2.js"></script>

var STATUT_LABELS = {
  'visité': 'Visité', 'connu': 'Connu', 'inexploré': 'Inexploré', 'inconnu': 'Inconnu'
};

async function init() {
  try {
    LIEUX_DATA = await loadData('lieux.json');
    LIEUX_MAP  = {};
    LIEUX_DATA.forEach(function(l){ LIEUX_MAP[l.id] = l; });
    buildVilleDropdown();
    applyFilters();
  } catch(e) {
    document.getElementById('lieux-grid').innerHTML =
      '<p style="color:var(--crimson);font-size:.82rem;font-style:italic;grid-column:1/-1;text-align:center;padding:24px;">⚠ Données inaccessibles en file://. Utiliser un serveur local.</p>';
  }
}

// ── Dropdown villes ──────────────────────────────────────────────────────────
function buildVilleDropdown() {
  var isMJ = (typeof getMJMode === 'function') ? getMJMode() : false;

  // Lieux visibles selon le mode
  var visible = isMJ
    ? LIEUX_DATA
    : LIEUX_DATA.filter(function(l){ return l.visible_joueurs !== false && STATUTS_MJ_ONLY.indexOf(l.statut) === -1; });

  // Collecter les villes qui ont au moins un lieu visible associé
  var villeIds = {};
  visible.forEach(function(l) {
    // La ville elle-même
    if (l.categorie === 'ville') villeIds[l.id] = true;
    // La ville parente d'un bâtiment
    if (l.ville_parente_id && LIEUX_MAP[l.ville_parente_id]) villeIds[l.ville_parente_id] = true;
  });

  // Construire les options triées par nom
  var villes = Object.keys(villeIds).map(function(id){ return LIEUX_MAP[id]; }).filter(Boolean);
  villes.sort(function(a, b){ return a.nom.localeCompare(b.nom, 'fr'); });

  var sel = document.getElementById('ville-select');
  var prev = currentVille;
  sel.innerHTML = '<option value="">Toutes les villes</option>';
  villes.forEach(function(l) {
    var opt = document.createElement('option');
    opt.value = l.id;
    opt.textContent = l.nom;
    sel.appendChild(opt);
  });

  // Restaurer la sélection si toujours valide
  if (prev && villeIds[prev]) sel.value = prev;
  else { sel.value = ''; currentVille = ''; }
}

// ── Filtres ──────────────────────────────────────────────────────────────────
function setVilleFilter() {
  currentVille = document.getElementById('ville-select').value;
  applyFilters();
}

function setStatutFilter(statut, btn) {
  currentStatut = statut;
  document.querySelectorAll('.filter-pill').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  var isMJ = (typeof getMJMode === 'function') ? getMJMode() : false;
  var q = (document.getElementById('search-input').value || '').toLowerCase().trim();

  // 1. Filtre mode joueur
  var filtered = isMJ
    ? LIEUX_DATA
    : LIEUX_DATA.filter(function(l){ return l.visible_joueurs !== false && STATUTS_MJ_ONLY.indexOf(l.statut) === -1; });

  // En mode joueur, si le statut actif est MJ-only → reset
  if (!isMJ && STATUTS_MJ_ONLY.indexOf(currentStatut) !== -1) {
    currentStatut = '';
    document.querySelectorAll('.filter-pill').forEach(function(b){ b.classList.toggle('active', !b.dataset || b.textContent === 'Tous'); });
    var pills = document.querySelectorAll('.filter-pill');
    pills.forEach(function(b){ b.classList.remove('active'); });
    pills[0].classList.add('active');
  }

  // 2. Filtre ville
  if (currentVille) {
    filtered = filtered.filter(function(l){
      return l.id === currentVille || l.ville_parente_id === currentVille;
    });
  }

  // 3. Filtre statut
  if (currentStatut) {
    if (currentStatut === 'inexploré') {
      filtered = filtered.filter(function(l){ return l.statut === 'inexploré' || l.statut === 'inconnu'; });
    } else {
      filtered = filtered.filter(function(l){ return l.statut === currentStatut; });
    }
  }

  // 4. Recherche texte
  if (q) {
    filtered = filtered.filter(function(l){
      return (l.nom||'').toLowerCase().includes(q)
          || (l.region||'').toLowerCase().includes(q)
          || (l.description||'').toLowerCase().includes(q);
    });
  }

  renderGrid(filtered);

  var total = isMJ ? LIEUX_DATA.length : LIEUX_DATA.filter(function(l){ return l.visible_joueurs !== false && STATUTS_MJ_ONLY.indexOf(l.statut) === -1; }).length;
  document.getElementById('l-count').textContent = filtered.length === total
    ? total + ' lieu' + (total > 1 ? 'x' : '')
    : filtered.length + ' / ' + total + ' lieu' + (total > 1 ? 'x' : '');
}

// ── Rendu grille ─────────────────────────────────────────────────────────────
function renderGrid(lieux) {
  var grid = document.getElementById('lieux-grid');
  if (!lieux.length) {
    grid.innerHTML = '<div class="l-empty">Aucun lieu correspondant.</div>';
    return;
  }
  grid.innerHTML = lieux.map(buildCard).join('');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildCard(lieu) {
  var icon     = TYPE_ICONS[lieu.type] || '◈';
  var statutLbl = STATUT_LABELS[lieu.statut] || lieu.statut || '';
  var statutCls = lieu.statut === 'visité' ? 'visite'
    : lieu.statut === 'inexploré' ? 'inexplore'
    : lieu.statut === 'inconnu'   ? 'inconnu'
    : 'connu';

  // Sous-lieux
  var sousLieux = '';
  if (lieu.sous_lieux && lieu.sous_lieux.length) {
    var chips = lieu.sous_lieux.map(function(id){
      var sl = LIEUX_MAP[id];
      return sl ? '<span class="chip">' + esc(sl.nom) + '</span>' : '';
    }).filter(Boolean).join('');
    if (chips) sousLieux = '<div class="lieu-detail-row"><span class="lieu-detail-lbl">Sous-lieux</span><div class="chip-list">' + chips + '</div></div>';
  }

  // PNJs présents
  var pnjs = '';
  if (lieu.pnjs_presents && lieu.pnjs_presents.length) {
    var chips = lieu.pnjs_presents.map(function(id){ return '<span class="chip">' + esc(id.replace('pnj_','')) + '</span>'; }).join('');
    pnjs = '<div class="lieu-detail-row"><span class="lieu-detail-lbl">PNJs présents</span><div class="chip-list">' + chips + '</div></div>';
  }

  var hasDetails = sousLieux || pnjs;
  var detailsBlock = hasDetails ? '<div class="lieu-details">' + sousLieux + pnjs + '</div>' : '';

  var mjHTML = lieu.notes_mj ? '<div class="mj-only"><div class="mj-block"><div class="mj-block-title">⚿ Notes MJ</div><div class="mj-block-txt">' + esc(lieu.notes_mj) + '</div></div></div>' : '';

  return '<div class="lieu-card" id="lieu-' + lieu.id + '">'
    + '<div class="lieu-head" onclick="toggleCard(\'' + lieu.id + '\')">'
    +   '<div class="lieu-type-icon">' + icon + '</div>'
    +   '<div class="lieu-head-info">'
    +     '<div class="lieu-nom">' + esc(lieu.nom) + '</div>'
    +     (lieu.region ? '<div class="lieu-region">' + esc(lieu.region) + '</div>' : '')
    +   '</div>'
    +   '<span class="l-chip ' + statutCls + '">' + esc(statutLbl) + '</span>'
    +   '<span class="lieu-chevron">▾</span>'
    + '</div>'
    + '<div class="lieu-div"></div>'
    + '<div class="lieu-body">'
    +   (lieu.description ? '<p class="lieu-desc">' + esc(lieu.description) + '</p>' : '')
    +   detailsBlock
    +   mjHTML
    + '</div>'
    + '</div>';
}

// ── Toggle carte ─────────────────────────────────────────────────────────────
function toggleCard(id) {
  var card = document.getElementById('lieu-' + id);
  if (!card) return;
  var isOpen = card.classList.contains('open');
  document.querySelectorAll('.lieu-card.open').forEach(function(c){ c.classList.remove('open'); });
  if (!isOpen) card.classList.add('open');
}

// ── Changement mode MJ ───────────────────────────────────────────────────────
document.addEventListener('mjmodechange', function() {
  if (!LIEUX_DATA.length) return;
  buildVilleDropdown();
  applyFilters();
});

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
