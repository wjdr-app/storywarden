<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carte — La Larme d'Argent</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/sw-v2.css">
<style>
/* ── BREADCRUMB ────────────────────────────────────────────────── */
.breadcrumb { display:flex; align-items:center; gap:4px; margin-bottom:12px; flex-wrap:wrap; }
.bc-item { font-family:var(--font-ui); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; }
.bc-link { color:var(--text-muted); cursor:pointer; transition:color .2s; }
.bc-link:hover { color:var(--text); }
.bc-current { color:var(--text); }
.bc-sep { color:var(--text-dim); font-size:.7rem; margin:0 2px; }

/* ── FULL-PAGE LAYOUT ──────────────────────────────────────────── */
/* Supprime le padding .main pour cette page seulement */
body  { height: 100%; overflow: hidden; }
.page-body { overflow: hidden; min-height: 0; }
.main { padding: 0 !important; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
#app  { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

/* ── MAP CONTAINER ─────────────────────────────────────────────── */
.map-wrap {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  background:var(--surface); border-top:1px solid var(--border-soft);
  overflow:hidden;
}
.map-header {
  border-bottom:1px solid var(--border-soft); padding:10px 18px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.map-title { font-family:var(--font-ui); font-size:.72rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
.niveau-badge {
  font-family:var(--font-ui); font-size:.65rem; letter-spacing:.1em; text-transform:uppercase;
  border:1px solid var(--border-soft); border-radius:20px; padding:3px 10px; color:var(--text-muted);
}
.mkr-count { font-size:.72rem; font-style:italic; color:var(--text-dim); margin-left:auto; }

/* ── LEAFLET MAP ─────────────────────────────────────────────────
   Pleine hauteur disponible : 100vh - topbar(84px) - map-header(~46px)
   - padding .main top/bottom (32+80px) = ~242px total déduites
   ─────────────────────────────────────────────────────────────── */
#leaflet-map {
  width:100%;
  height:100%;
  min-height:calc(100vh - 200px);
  background:var(--surface);
}
.leaflet-popup-content-wrapper {
  background:var(--surface); border:1px solid var(--border-soft);
  border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.5); color:var(--text);
}
.leaflet-popup-content { margin:10px 14px; }
.leaflet-popup-tip-container .leaflet-popup-tip { background:var(--surface); }
.leaflet-control-zoom { border: none !important; box-shadow: none !important; }
.leaflet-control-zoom a {
  width: 36px !important; height: 36px !important; line-height: 36px !important;
  font-size: 18px !important; font-weight: 700;
  background: var(--surface) !important; color: var(--text) !important;
  border: 1px solid var(--border-mid) !important;
  transition: background .15s, border-color .15s;
}
.leaflet-control-zoom a:hover { background: var(--surface-hi) !important; border-color: var(--crimson-bd) !important; }
.leaflet-control-zoom-in  { border-radius: 8px 8px 0 0 !important; }
.leaflet-control-zoom-out { border-radius: 0 0 8px 8px !important; border-top: none !important; }
.leaflet-control-attribution { display:none!important; }
.leaflet-tooltip {
  background:var(--surface); border:1px solid var(--border-soft); color:var(--text);
  font-family:var(--font-body); font-size:.82rem; border-radius:6px;
  padding:3px 8px; box-shadow:0 2px 6px rgba(0,0,0,.5); white-space:nowrap;
}
.leaflet-tooltip::before { border-top-color:var(--border-soft); }

/* Bouton retour dans la carte */
.leaflet-back-control {
  background:var(--surface); border:1px solid var(--crimson-bd);
  border-radius:8px; width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  color:var(--crimson); cursor:pointer; font-size:1.1rem; margin-top:4px;
  transition:all .2s; line-height:1; padding:0;
}
.leaflet-back-control:hover { background:var(--crimson-dim); border-color:var(--crimson); color:var(--text); }

/* Navigation entre étages */
.etage-badge {
  font-family:var(--font-ui); font-size:.48rem; letter-spacing:.12em; text-transform:uppercase;
  background:var(--surface-mid); border-radius:20px; padding:2px 8px; color:var(--text);
}
.leaflet-floor-nav { display:flex; flex-direction:column; gap:3px; margin-top:4px; }
.leaflet-floor-btn {
  display:block; width:100%; background:var(--surface);
  border:1px solid var(--border-soft); border-radius:6px;
  padding:5px 10px; font-family:var(--font-ui); font-size:.65rem;
  letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted);
  cursor:pointer; transition:all .2s; text-align:center; min-width:44px;
}
.leaflet-floor-btn:hover { background:var(--crimson-dim); border-color:var(--crimson-bd); color:var(--text); }
.leaflet-floor-active {
  display:block; width:100%; background:var(--crimson);
  border:1px solid var(--crimson); border-radius:6px;
  padding:5px 10px; font-family:var(--font-ui); font-size:.65rem;
  letter-spacing:.08em; text-transform:uppercase; color:var(--text);
  text-align:center; min-width:44px;
}

/* ── CARTE GRID (liste des cartes racines) ─────────────────────── */
.carte-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; margin-top:12px; }
.carte-card {
  background:var(--surface); border:1px solid var(--border-soft);
  border-radius:12px; overflow:hidden; cursor:pointer;
  transition:border-color .2s, transform .15s;
}
.carte-card:hover { border-color:var(--border-mid); transform:translateY(-2px); }
.carte-thumb { width:100%; height:120px; object-fit:cover; display:block; }
.carte-thumb-placeholder {
  width:100%; height:120px; background:var(--surface-mid);
  display:flex; align-items:center; justify-content:center;
  font-size:2rem; color:var(--text-dim);
}
.carte-card-info { padding:10px 14px 12px; }
.carte-card-nom { font-family:var(--font-ui); font-size:.74rem; font-weight:700; margin-bottom:3px; }
.carte-card-niveau { font-size:.7rem; font-style:italic; color:var(--text-dim); }

/* ── MISC ──────────────────────────────────────────────────────── */
.page-title { font-family:var(--font-ui); font-size:.95rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; margin-bottom:14px; }
.back-btn {
  display:inline-flex; align-items:center; gap:5px;
  background:transparent; border:1px solid var(--crimson-bd); border-radius:20px;
  padding:5px 14px; font-family:var(--font-ui); font-size:.7rem;
  letter-spacing:.08em; text-transform:uppercase; color:var(--crimson);
  cursor:pointer; transition:all .2s; white-space:nowrap;
}
.back-btn:hover { background:var(--crimson-dim); border-color:var(--crimson); color:var(--text); }
.placeholder-map {
  width:100%; height:400px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px;
}
.placeholder-label { font-family:var(--font-ui); font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:var(--text-dim); }
.empty-state {
  background:var(--surface); border:1px solid var(--border-soft);
  border-radius:12px; padding:40px; text-align:center;
  font-style:italic; color:var(--text-muted);
}
.error-notice {
  background:var(--surface); border:1px solid var(--crimson-bd);
  border-radius:12px; padding:14px 20px; margin-bottom:12px;
  font-size:.8rem; color:var(--crimson);
}
.draw-toolbar{display:flex;align-items:center;gap:6px;margin-left:auto;}
.draw-btn{background:var(--surface-mid);border:1px solid var(--border-soft);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:.85rem;color:var(--text-muted);transition:all .18s;line-height:1;font-family:inherit;}
.draw-btn:hover{border-color:var(--border-mid);color:var(--text);}
.draw-btn.db-on{background:var(--crimson);border-color:var(--crimson);color:#fff;}
.draw-btn.db-danger{color:var(--crimson);border-color:var(--crimson-bd);}
.draw-canvas-wrap{position:relative;flex:1;min-height:0;overflow:hidden;}
#draw-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:500;pointer-events:none;}
#draw-time{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;font-family:var(--font-ui);font-size:.78rem;letter-spacing:.06em;padding:5px 16px;border-radius:20px;z-index:600;pointer-events:none;border:1px solid rgba(255,255,255,.15);white-space:nowrap;display:none;}
</style>
</head>
<body>

<div id="app"></div>

<script src="vendor/leaflet.js"></script>
<script src="js/storage.js"></script>
<script src="js/nav-v2.js"></script>
<script>
'use strict';
const NIVEAUX = { region: 'R\u00e9gion', ville: 'Ville', batiment: 'B\u00e2timent', battlemap: 'B\u00e2timent', monde: 'Monde' };

let _cartes = [];
let _lieux = [];
let _navStack = [];
let _leaflet = null;

function isMJ() { return typeof getMJMode === 'function' ? getMJMode() : localStorage.getItem('sw_mj_mode') === 'true'; }
function esc(s) { return !s ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── ÉTAGES ────────────────────────────────────────────────────────
let _currentEtageIdx = 0;

function showEtage(carte, idx) {
  _currentEtageIdx = idx;
  renderBattlemap(carte);
}

// ── RETOUR CARTE PARENTE ──────────────────────────────────────────
const PARENT_LABELS = {
  monde: 'du monde',
  region: 'de la r\u00e9gion',
  ville: 'de la ville',
  batiment: 'du b\u00e2timent',
  battlemap: 'du b\u00e2timent'
};
function buildBackBtn(carte) {
  if (!carte.parent_id) return '';
  const parent = _cartes.find(c => c.id === carte.parent_id && (isMJ() || c.visible_joueurs !== false));
  if (!parent) return '';
  const label = PARENT_LABELS[parent.niveau] || 'de la carte parente';
  return `<button class="back-btn" onclick="goToParent('${parent.id}')">&#8592; Retour \u00e0 la carte ${label}</button>`;
}
function goToParent(parentId) {
  if (_navStack.length > 0) _navStack.pop();
  showCarte(parentId);
}

// ── INIT ──────────────────────────────────────────────────────────
async function init() {
  if (window._swCampaignReady) await window._swCampaignReady;
  const app = document.getElementById('app');
  try {
    [_cartes, _lieux] = await Promise.all([
      loadData('cartes.json').catch(() => null),
      loadData('lieux.json').catch(() => null),
    ]);
  } catch(err) {
    console.error('[carte] init error:', err);
  }
  _cartes = Array.isArray(_cartes) ? _cartes : [];
  _lieux  = Array.isArray(_lieux)  ? _lieux  : [];

  const roots = _cartes.filter(c => !c.parent_id && (isMJ() || c.visible_joueurs !== false));
  (function(){ var d=document.createElement('div'); d.id='_carte_diag'; d.style.cssText='position:fixed;bottom:8px;right:8px;background:rgba(0,0,0,.85);color:#fff;font:10px/1.4 monospace;padding:6px 10px;border-radius:5px;z-index:99999;pointer-events:none;'; d.textContent='cid:'+getCampaignId()+'|cartes:'+_cartes.length+'|roots:'+roots.length; document.body.appendChild(d); })();
  if (roots.length === 0) {
    app.innerHTML = '<div class="empty-state">Aucune carte disponible \u2014 cr\u00e9ez des cartes dans l\'admin.</div>';
  } else if (roots.length === 1) {
    var _diagEl=document.getElementById('_carte_diag'); if(_diagEl) _diagEl.textContent+=' | L:'+(typeof L);
    showCarte(roots[0].id);
  } else {
    showList(roots);
  }
}

// ── LISTE DES CARTES RACINES ───────────────────────────────────────
function showList(cartes) {
  document.getElementById('app').innerHTML =
    '<div class="page-title">Cartes</div>' +
    '<div class="carte-grid">' +
    cartes.map(c =>
      `<div class="carte-card" onclick="showCarte('${c.id}')">` +
        (c.image
          ? `<img src="${esc(c.image)}" alt="${esc(c.nom)}" class="carte-thumb" onerror="this.style.display='none'">`
          : '<div class="carte-thumb-placeholder">\ud83d\uddfa</div>') +
        `<div class="carte-card-info">` +
          `<div class="carte-card-nom">${esc(c.nom)}</div>` +
          `<div class="carte-card-niveau">${esc(NIVEAUX[c.niveau] || c.niveau || '')}</div>` +
        `</div>` +
      `</div>`
    ).join('') +
    '</div>';
}

// ── NAVIGATION ──────────────────────────────────────────────────────
function showCarte(carteId) {
  _currentEtageIdx = 0;
  const carte = _cartes.find(c => c.id === carteId);
  if (!carte) return;
  if (_navStack[_navStack.length - 1] !== carteId) _navStack.push(carteId);
  if (carte.niveau === 'battlemap' || carte.niveau === 'batiment') renderBattlemap(carte);
  else renderLeaflet(carte);
}

function navTo(idx) {
  _navStack = _navStack.slice(0, idx + 1);
  const carte = _cartes.find(c => c.id === _navStack[idx]);
  if (!carte) return;
  _navStack.pop();
  showCarte(carte.id);
}

// ── BREADCRUMB ──────────────────────────────────────────────────────
function buildBreadcrumb() {
  if (_navStack.length <= 1) return '';
  const items = _navStack.map((id, i) => {
    const c = _cartes.find(x => x.id === id);
    const nom = c ? c.nom : id;
    if (i < _navStack.length - 1) {
      return `<span class="bc-item bc-link" onclick="navTo(${i})">${esc(nom)}</span>`;
    }
    return `<span class="bc-item bc-current">${esc(nom)}</span>`;
  });
  return '<div class="breadcrumb">' + items.join('<span class="bc-sep">\u203a</span>') + '</div>';
}

// ── BATTLEMAP (Leaflet) ─────────────────────────────────────────────
function renderBattlemap(carte) {
  destroyLeaflet();
  const etages = (carte.etages && carte.etages.length > 0) ? carte.etages : null;
  const etage = etages ? (etages[_currentEtageIdx] || etages[0]) : null;
  const imgSrc = etage ? etage.image : carte.image;
  const W = (etage ? etage.largeur : carte.largeur) || 1000;
  const H = (etage ? etage.hauteur : carte.hauteur) || 800;

  document.getElementById('app').innerHTML =
    buildBreadcrumb() +
    `<div class="map-wrap">` +
      `<div class="map-header">` +
        buildBackBtn(carte) +
        `<span class="map-title">${esc(carte.nom)}</span>` +
        `<span class="niveau-badge">${NIVEAUX[carte.niveau] || ''}</span>` +
        (etage && etage.nom ? `<span class="etage-badge">${esc(etage.nom)}</span>` : '') +
      `</div>` +
      `<div id="leaflet-map"></div>` +
    `</div>`;

  if (!imgSrc) {
    document.getElementById('leaflet-map').innerHTML =
      '<div class="placeholder-map"><span class="placeholder-label">Aucune image \u2014 configurez les \u00e9tages dans l\'admin</span></div>';
    return;
  }

  const bounds = [[0, 0], [H, W]];
  var map; try { map = L.map('leaflet-map', {
    crs: L.CRS.Simple,
    minZoom: -5,
    maxZoom: 3,
    zoomSnap: 0.25,
    zoomControl: true,
    attributionControl: false
  }); } catch(err) { var _d2=document.getElementById('_carte_diag'); if(_d2) _d2.textContent+=' | LMAP_ERR:'+err.message; return; }
  _leaflet = map;

  if (carte.parent_id) {
    const _parent = _cartes.find(c => c.id === carte.parent_id && (isMJ() || c.visible_joueurs !== false));
    if (_parent) {
      const BackCtrl = L.Control.extend({
        options: { position: 'topleft' },
        onAdd: function() {
          const btn = L.DomUtil.create('button', 'leaflet-back-control');
          btn.innerHTML = '&#8592;';
          btn.title = 'Retour \u00e0 la carte ' + (PARENT_LABELS[_parent.niveau] || 'parente');
          L.DomEvent.on(btn, 'click', function(e) {
            L.DomEvent.stopPropagation(e);
            goToParent(_parent.id);
          });
          return btn;
        }
      });
      new BackCtrl().addTo(map);
    }
  }

  if (etages && etages.length > 1) {
    const currIdx = _currentEtageIdx < etages.length ? _currentEtageIdx : 0;
    const FloorCtrl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function() {
        const div = L.DomUtil.create('div', 'leaflet-floor-nav');
        etages.forEach((et, i) => {
          if (i === currIdx) {
            const span = L.DomUtil.create('span', 'leaflet-floor-active', div);
            span.textContent = et.nom || ('\u00c9tage ' + (i + 1));
          } else {
            const btn = L.DomUtil.create('button', 'leaflet-floor-btn', div);
            btn.textContent = et.nom || ('\u00c9tage ' + (i + 1));
            L.DomEvent.on(btn, 'click', function(e) {
              L.DomEvent.stopPropagation(e);
              showEtage(carte, i);
            });
          }
        });
        return div;
      }
    });
    new FloorCtrl().addTo(map);
  }

  L.imageOverlay(imgSrc, bounds).addTo(map);
  map.fitBounds(bounds, {padding: [2, 2]});
  map.setMinZoom(map.getZoom());
  setTimeout(function(){ if(_leaflet){ _leaflet.invalidateSize(); _leaflet.fitBounds(bounds,{padding:[2,2]}); _leaflet.setMinZoom(_leaflet.getZoom()); }},150);
}

// ── LEAFLET MAP ────────────────────────────────────────────────────
function renderLeaflet(carte) {
  destroyLeaflet();
  const marqueurs = (carte.marqueurs || []).filter(m => isMJ() || m.visible_joueurs !== false);

  document.getElementById('app').innerHTML =
    buildBreadcrumb() +
    `<div class="map-wrap">` +
      `<div class="map-header">` +
        `<span class="map-title">${esc(carte.nom)}</span>` +
        `<span class="niveau-badge">${esc(NIVEAUX[carte.niveau] || carte.niveau || '')}</span>` +
        `<span class="mkr-count">${marqueurs.length} marqueur(s)</span>` +
        `<div class="draw-toolbar">` +
          `<button class="draw-btn" id="db-pen" onclick="dTool('pen')" title="Crayon libre">\u270F</button>` +
          `<button class="draw-btn" id="db-plume" onclick="dTool('plume')" title="Trac\u00e9 liss\u00e9">\uD83D\uDD8B</button>` +
          `<button class="draw-btn db-danger" onclick="dUndo()" title="Annuler dernier">\u21A9</button>` +
          `<button class="draw-btn" onclick="dClear()" title="Tout effacer">\u00D7</button>` +
        `</div>` +
      `</div>` +
      `<div class="draw-canvas-wrap">` +
        `<div id="leaflet-map"></div>` +
        `<canvas id="draw-canvas"></canvas>` +
        (carte.niveau === 'region' ? `<div id="draw-time"></div>` : '') +
      `</div>` +
    `</div>`;

  if (!carte.image) {
    document.getElementById('leaflet-map').innerHTML =
      '<div class="placeholder-map"><span class="placeholder-label">Aucune image \u2014 configurez une image dans l\'admin</span></div>';
    return;
  }

  const W = carte.largeur || 1000;
  const H = carte.hauteur || 800;
  const bounds = [[0, 0], [H, W]];

  var map; try { map = L.map('leaflet-map', {
    crs: L.CRS.Simple,
    minZoom: -5,
    maxZoom: 3,
    zoomSnap: 0.25,
    zoomControl: true,
    attributionControl: false
  }); } catch(err) { var _d2=document.getElementById('_carte_diag'); if(_d2) _d2.textContent+=' | LMAP_ERR:'+err.message; return; }
  _leaflet = map;

  if (carte.parent_id) {
    const _parent = _cartes.find(c => c.id === carte.parent_id && (isMJ() || c.visible_joueurs !== false));
    if (_parent) {
      const BackCtrl = L.Control.extend({
        options: { position: 'topleft' },
        onAdd: function() {
          const btn = L.DomUtil.create('button', 'leaflet-back-control');
          btn.innerHTML = '&#8592;';
          btn.title = 'Retour \u00e0 la carte ' + (PARENT_LABELS[_parent.niveau] || 'parente');
          L.DomEvent.on(btn, 'click', function(e) {
            L.DomEvent.stopPropagation(e);
            goToParent(_parent.id);
          });
          return btn;
        }
      });
      new BackCtrl().addTo(map);
    }
  }

  L.imageOverlay(carte.image, bounds).addTo(map);
  map.fitBounds(bounds, {padding: [2, 2]});
  map.setMinZoom(map.getZoom());
  (function(m,b){ setTimeout(function(){ if(_leaflet){ _leaflet.invalidateSize(); _leaflet.fitBounds(b,{padding:[2,2]}); _leaflet.setMinZoom(_leaflet.getZoom()); var el=document.getElementById('leaflet-map'); var d=document.getElementById('_carte_diag'); if(d&&el)d.textContent+=' | mapH:'+el.offsetHeight; }},150); })(map,bounds);
  dInit(carte, map);

  marqueurs.forEach((m, idx) => {
    const lieu = _lieux.find(l => l.id === m.lieu_id);
    const enfantCarte = m.enfant_carte_id
      ? _cartes.find(c => c.id === m.enfant_carte_id && (isMJ() || c.visible_joueurs !== false))
      : null;

    const isMJOnly = m.visible_joueurs === false;
    const STATUT_COLORS = {'visit\u00e9':'#44AA99','connu':'#88C4B0','inexplor\u00e9':'#88C4B0','inconnu':'#888888'};
    const color = m.couleur || (isMJOnly ? '#c44' : (STATUT_COLORS[lieu?.statut] || '#44AA99'));
    const latLng = [H - m.y, m.x];

    const icon = L.divIcon({
      className: '',
      html: `<div style="width:22px;height:22px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--text);cursor:pointer;">${idx + 1}</div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    const nomLieu = lieu ? lieu.nom : (m.lieu_id || 'Marqueur');
    const typeLieu = lieu ? (lieu.type || lieu.statut || '') : '';
    const mjTag = isMJOnly && isMJ() ? '<div style="font-size:.65rem;color:var(--crimson);margin-top:2px;">\ud83d\udd12 MJ seulement</div>' : '';
    const zoomBtn = enfantCarte
      ? `<div style="margin-top:8px"><button onclick="showCarte('${enfantCarte.id}')" style="background:var(--crimson);color:var(--text);border:none;border-radius:6px;padding:4px 12px;font-size:.72rem;cursor:pointer;font-family:inherit;letter-spacing:.04em;">Voir carte \u2192</button></div>`
      : '';

    const descTag = (lieu && lieu.statut === 'visit\u00e9' && lieu.description)
      ? `<div style="font-size:.78rem;font-style:italic;color:var(--text-muted);margin:6px 0 4px;line-height:1.55;border-top:1px solid var(--border-soft);padding-top:6px;">${esc(lieu.description)}</div>`
      : '';
    const popup = L.popup({ maxWidth: 260, className: '' }).setContent(
      `<div style="font-family:var(--font-body);">` +
        `<div style="font-family:var(--font-ui);font-size:.78rem;font-weight:700;margin-bottom:3px;">${esc(nomLieu)}</div>` +
        (typeLieu ? `<div style="font-size:.75rem;font-style:italic;color:var(--text-muted);margin-bottom:4px;">${esc(typeLieu)}</div>` : '') +
        mjTag +
        descTag +
        zoomBtn +
      `</div>`
    );

    L.marker(latLng, { icon }).addTo(map)
      .bindTooltip(nomLieu, { direction: 'top', offset: [0, -13] })
      .bindPopup(popup);
  });
}

// â”€â”€ DESSIN CARTE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const D_SCALE = 244.4;
var _dTool=null,_dPaths=[],_dActive=false,_dCur=[],_dPlume=[],_dCtx=null,_dCv=null,_dReg=false,_dMap=null;

function dInit(carte,map){
  _dReg=carte.niveau==='region'; _dMap=map; _dPaths=[]; _dCur=[]; _dPlume=[]; _dTool=null;
  _dCv=document.getElementById('draw-canvas');
  if(!_dCv) return;
  function sync(){ _dCv.width=_dCv.offsetWidth; _dCv.height=_dCv.offsetHeight; _dCtx=_dCv.getContext('2d'); _dCtx.strokeStyle='#e05252'; _dCtx.lineWidth=2.5; _dCtx.lineJoin='round'; _dCtx.lineCap='round'; _dRedraw(); }
  sync(); new ResizeObserver(sync).observe(_dCv.parentElement);
  map.on('zoom move', _dRedraw);
  _dCv.addEventListener('mousedown',_dS); _dCv.addEventListener('mousemove',_dM); _dCv.addEventListener('mouseup',_dE);
  _dCv.addEventListener('dblclick',_dPF); _dCv.addEventListener('contextmenu',function(e){e.preventDefault();_dPlume=[];_dCur=[];_dActive=false;_dRedraw();if(_dTool)dTool(_dTool);});
  _dCv.addEventListener('wheel',function(e){if(!_dMap)return;_dMap.getContainer().dispatchEvent(new WheelEvent('wheel',{bubbles:true,cancelable:true,deltaX:e.deltaX,deltaY:e.deltaY,deltaMode:e.deltaMode,clientX:e.clientX,clientY:e.clientY}));});
}

function dTool(t){
  _dTool=(_dTool===t)?null:t; _dPlume=[]; _dActive=false;
  ['pen','plume'].forEach(function(k){var b=document.getElementById('db-'+k);if(b)b.classList.toggle('db-on',_dTool===k);});
  if(_dCv){_dCv.style.pointerEvents=_dTool?'all':'none';_dCv.style.cursor=_dTool?'crosshair':'default';}
  if(_dMap){if(_dTool){_dMap.dragging.disable();}else{_dMap.dragging.enable();}}
}

function _s2m(sx,sy){ if(!_dMap) return null; return _dMap.containerPointToLatLng(L.point(sx,sy)); }
function _m2s(ll){ if(!_dMap||!ll) return null; var p=_dMap.latLngToContainerPoint(ll); return {x:p.x,y:p.y}; }

function _dS(e){
  if(!_dTool) return;
  if(_dTool==='pen'){_dActive=true;_dCur=[{x:e.offsetX,y:e.offsetY}];}
  else if(_dTool==='plume'){var ll=_s2m(e.offsetX,e.offsetY);if(!ll)return;_dPlume.push(ll);_dRedraw();}
}
function _dM(e){
  if(_dTool==='pen'&&_dActive){
    var p={x:e.offsetX,y:e.offsetY}; _dCur.push(p);
    if(_dCur.length>=2){var p1=_dCur[_dCur.length-2],p2=_dCur[_dCur.length-1];_dCtx.beginPath();_dCtx.strokeStyle='#e05252';_dCtx.lineWidth=2.5;_dCtx.moveTo(p1.x,p1.y);_dCtx.lineTo(p2.x,p2.y);_dCtx.stroke();}
    _dTime();
  } else if(_dTool==='plume'&&_dPlume.length>0){
    _dRedraw();
    var last=_m2s(_dPlume[_dPlume.length-1]);
    if(last){_dCtx.beginPath();_dCtx.setLineDash([4,4]);_dCtx.strokeStyle='rgba(224,82,82,0.4)';_dCtx.moveTo(last.x,last.y);_dCtx.lineTo(e.offsetX,e.offsetY);_dCtx.stroke();_dCtx.setLineDash([]);}
  }
}
function _dE(e){
  if(_dTool==='pen'&&_dActive&&_dCur.length>1){
    _dActive=false;
    var llpts=_dCur.map(function(p){return _s2m(p.x,p.y);}).filter(Boolean);
    _dPaths.push({pts:llpts,tool:'pen'}); _dCur=[]; _dTime();
  }
}
function _dPF(e){
  if(_dTool!=='plume') return; e.preventDefault();
  if(_dPlume.length>=2){
    var a=_m2s(_dPlume[_dPlume.length-1]),b=_m2s(_dPlume[_dPlume.length-2]);
    if(a&&b&&Math.abs(a.x-b.x)<6&&Math.abs(a.y-b.y)<6) _dPlume.pop();
  }
  if(_dPlume.length<2){_dPlume=[];return;}
  _dPaths.push({pts:[..._dPlume],tool:'plume'});_dPlume=[];_dRedraw();_dTime();
}
function _dDot(sp){if(!sp)return;_dCtx.beginPath();_dCtx.arc(sp.x,sp.y,3,0,Math.PI*2);_dCtx.fillStyle='#e05252';_dCtx.fill();}
function _dCatmull(ctx,spts){
  if(spts.length<2) return;
  var ext=[spts[0]].concat(spts,[spts[spts.length-1]]);
  ctx.moveTo(spts[0].x,spts[0].y);
  for(var i=1;i<ext.length-2;i++){var p0=ext[i-1],p1=ext[i],p2=ext[i+1],p3=ext[i+2];for(var t=0;t<=1;t+=0.05){var t2=t*t,t3=t2*t;ctx.lineTo(0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3));}}
}
function _dRedraw(){
  if(!_dCtx||!_dCv) return;
  _dCtx.clearRect(0,0,_dCv.width,_dCv.height);
  _dCtx.strokeStyle='#e05252';_dCtx.lineWidth=2.5;_dCtx.lineJoin='round';_dCtx.lineCap='round';_dCtx.setLineDash([]);
  _dPaths.forEach(function(path){
    var spts=path.pts.map(_m2s).filter(Boolean);
    if(spts.length<2) return;
    _dCtx.beginPath();
    if(path.tool==='plume'){_dCatmull(_dCtx,spts);}
    else{_dCtx.moveTo(spts[0].x,spts[0].y);spts.slice(1).forEach(function(p){_dCtx.lineTo(p.x,p.y);});}
    _dCtx.stroke();
    if(path.tool==='plume') spts.forEach(_dDot);
  });
  _dPlume.forEach(function(ll){_dDot(_m2s(ll));});
  if(_dCur.length>1){_dCtx.beginPath();_dCtx.moveTo(_dCur[0].x,_dCur[0].y);_dCur.slice(1).forEach(function(p){_dCtx.lineTo(p.x,p.y);});_dCtx.stroke();}
}
function _dPathPx(llpts){
  var d=0;
  for(var i=1;i<llpts.length;i++){var dx=llpts[i].lng-llpts[i-1].lng,dy=llpts[i].lat-llpts[i-1].lat;d+=Math.sqrt(dx*dx+dy*dy);}
  return d;
}
function _dSampleCR(llpts){
  if(llpts.length<2) return llpts;
  var res=[],ext=[llpts[0]].concat(llpts,[llpts[llpts.length-1]]);
  for(var i=1;i<ext.length-2;i++){var p0=ext[i-1],p1=ext[i],p2=ext[i+1],p3=ext[i+2];for(var j=0;j<=20;j++){var t=j/20,t2=t*t,t3=t2*t;res.push({lng:0.5*((2*p1.lng)+(-p0.lng+p2.lng)*t+(2*p0.lng-5*p1.lng+4*p2.lng-p3.lng)*t2+(-p0.lng+3*p1.lng-3*p2.lng+p3.lng)*t3),lat:0.5*((2*p1.lat)+(-p0.lat+p2.lat)*t+(2*p0.lat-5*p1.lat+4*p2.lat-p3.lat)*t2+(-p0.lat+3*p1.lat-3*p2.lat+p3.lat)*t3)});}}
  return res;
}
function _dTime(){
  if(!_dReg) return;
  var b=document.getElementById('draw-time');if(!b) return;
  var px=0;
  _dPaths.forEach(function(p){px+=_dPathPx(p.tool==='plume'?_dSampleCR(p.pts):p.pts);});
  if(_dCur.length>1){var ll=_dCur.map(function(p){return _s2m(p.x,p.y);}).filter(Boolean);px+=_dPathPx(ll);}
  if(px<5){b.style.display='none';return;}
  var d=px/D_SCALE,dr=Math.round(d*10)/10;
  b.textContent='\uD83D\uDEB6 '+(dr<1?'< 1 jour':dr+(dr<=1?' jour':' jours'));
  b.style.display='block';
}
function dUndo(){if(_dPlume.length>0){_dPlume.pop();_dRedraw();return;}if(_dPaths.length>0){_dPaths.pop();_dRedraw();_dTime();}}
function dClear(){_dPaths=[];_dCur=[];_dPlume=[];if(_dCtx&&_dCv)_dCtx.clearRect(0,0,_dCv.width,_dCv.height);_dTime();}
function destroyLeaflet() {
  _dTool=null;_dPaths=[];_dCur=[];_dPlume=[];_dCtx=null;_dCv=null;_dActive=false;_dMap=null;
  if (_leaflet) { _leaflet.remove(); _leaflet = null; }
}

document.addEventListener('mjmodechange', function() {
  if (!_cartes || !_cartes.length) return;
  var roots = _cartes.filter(function(c) { return !c.parent_id && (isMJ() || c.visible_joueurs !== false); });
  var app = document.getElementById('app');
  if (roots.length === 0) { app.innerHTML = '<div class="empty-state">Aucune carte disponible.</div>'; }
  else if (roots.length === 1) { showCarte(roots[0].id); }
  else { showList(roots); }
});
document.addEventListener('DOMContentLoaded', init);
</script>
