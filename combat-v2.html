// ══════════════════════════════════════════════════════════════════════════════
// BATTLEMAP — Canvas complet avec murs, obstacles, pan/zoom, grille infinie
// ══════════════════════════════════════════════════════════════════════════════
const BM_KEY = ()=>'lca_bm_'+getCid();
let BM = {
  cols:30, rows:22, cellSize:44,
  bgData:null, bgScale:1, bgX:0, bgY:0,
  gridColor:'#ffffff',
  walls:[],       // ["h:x:y","v:x:y"]
  obstacles:{}    // {"x,y":"mur"|"eau"|"difficile"}
};
let BV = {x:40, y:40, scale:1};
let bmCanvas=null, bmCtx=null;
let bmTool='select';
let bmSelTok=null;
let bmDrag=null, bmPanning=false, bmPanBase=null, bmSpaceDown=false;
let bmBrushing=false, bmBrushAdd=true, bmBrushed=new Set();
let bmBgImg=null;

const BM_OBS_SEQ  = ['mur','eau','difficile'];
const BM_OBS_FILL = {mur:'rgba(70,70,70,.82)',eau:'rgba(25,80,190,.5)',difficile:'rgba(100,65,15,.55)'};
const BM_OBS_ICO  = {mur:'▪',eau:'≈',difficile:'~'};

function bmLoadState(){
  const sv=localStorage.getItem(BM_KEY());
  if(sv) try{
    const d=JSON.parse(sv);
    BM.cols=d.cols||30; BM.rows=d.rows||22; BM.cellSize=d.cellSize||44;
    BM.bgData=d.bgData||null; BM.bgScale=d.bgScale||1; BM.bgX=d.bgX||0; BM.bgY=d.bgY||0;
    BM.gridColor=d.gridColor||'#ffffff'; BM.walls=d.walls||[]; BM.obstacles=d.obstacles||{};
  }catch(e){}
  if(BM.bgData){ bmBgImg=new Image(); bmBgImg.onload=()=>bmRender(); bmBgImg.src=BM.bgData; }
}
function bmSaveState(){
  localStorage.setItem(BM_KEY(), JSON.stringify({...BM}));
  bmBcSend();
}

function bmSyncTokens(){
  if(!bmCanvas) return;
  // Retirer les tokens sans combattant correspondant
  BM._tokens = (BM._tokens||[]).filter(t=>S.combatants.some(c=>c.id===t.combId));
  // Ajouter les manquants
  S.combatants.forEach((c,i)=>{
    if((BM._tokens||[]).some(t=>t.combId===c.id)) return;
    const pos = S.bmTokens[c.id]||{cx:i%8, cy:Math.floor(i/8)+1};
    if(!BM._tokens) BM._tokens=[];
    BM._tokens.push({id:c.id, combId:c.id, name:c.nom, type:c.type, cx:pos.cx, cy:pos.cy});
  });
  // Mettre à jour les noms et positions depuis S.bmTokens
  (BM._tokens||[]).forEach(t=>{ const c=S.combatants.find(x=>x.id===t.combId); if(c){ t.name=c.nom; const p=S.bmTokens[t.combId]; if(p){ t.cx=p.cx; t.cy=p.cy; } } });
  bmRender();
}

function bmInitCanvas(){
  bmCanvas = document.getElementById('bm-canvas'); if(!bmCanvas) return;
  bmCtx = bmCanvas.getContext('2d');
  new ResizeObserver(bmResizeCanvas).observe(document.getElementById('bm-wrap'));
  bmLoadState();
  bmCanvas.addEventListener('mousedown',  bmOnMouseDown);
  bmCanvas.addEventListener('mousemove',  bmOnMouseMove);
  bmCanvas.addEventListener('mouseup',    bmOnMouseUp);
  bmCanvas.addEventListener('mouseleave', bmOnMouseLeave);
  bmCanvas.addEventListener('contextmenu',e=>e.preventDefault());
  bmCanvas.addEventListener('wheel',      bmOnWheel, {passive:false});
  bmCanvas.addEventListener('dblclick',   bmOnDblClick);
  document.addEventListener('keydown',    bmOnKeyDown);
  document.addEventListener('keyup',      bmOnKeyUp);
  if(!IS_JOUEUR) bmRenderToolbar();
  bmSyncTokens();
}

function bmResizeCanvas(){
  const wrap=document.getElementById('bm-wrap'); if(!wrap||!bmCanvas) return;
  const w=wrap.clientWidth, h=wrap.clientHeight;
  if(!w||!h) return;
  bmCanvas.width=w; bmCanvas.height=h;
  bmRender();
}

function bmRender(){
  if(!bmCtx||!bmCanvas) return;
  bmCtx.clearRect(0,0,bmCanvas.width,bmCanvas.height);
  bmCtx.save();
  bmCtx.translate(BV.x,BV.y);
  bmCtx.scale(BV.scale,BV.scale);
  bmDrawBg(); bmDrawObstacles(); bmDrawGrid(); bmDrawWalls(); if(!IS_JOUEUR&&bmSelTok)bmDrawZone(bmSelTok); bmDrawTokens();
  bmCtx.restore();
}

function bmDrawBg(){
  if(!bmBgImg||!bmBgImg.complete||!bmBgImg.naturalWidth) return;
  bmCtx.globalAlpha=.75;
  bmCtx.drawImage(bmBgImg,BM.bgX,BM.bgY,bmBgImg.naturalWidth*BM.bgScale,bmBgImg.naturalHeight*BM.bgScale);
  bmCtx.globalAlpha=1;
}

function hexToRgba(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return`rgba(${r},${g},${b},${a})`; }

function bmDrawGrid(){
  // Grille infinie — dessine sur tout le viewport
  const C=BM.cellSize, gc=BM.gridColor||'#ffffff';
  const x0=-BV.x/BV.scale, y0=-BV.y/BV.scale;
  const x1=x0+bmCanvas.width/BV.scale, y1=y0+bmCanvas.height/BV.scale;
  const sx=Math.floor(x0/C)*C, sy=Math.floor(y0/C)*C;
  const go=BM.gridOpacity!=null?BM.gridOpacity:0.08;
  bmCtx.strokeStyle=hexToRgba(gc,go); bmCtx.lineWidth=1/BV.scale;
  bmCtx.beginPath();
  for(let x=sx;x<=x1;x+=C){ bmCtx.moveTo(x,y0); bmCtx.lineTo(x,y1); }
  for(let y=sy;y<=y1;y+=C){ bmCtx.moveTo(x0,y); bmCtx.lineTo(x1,y); }
  bmCtx.stroke();
  // Bordure de la zone définie
  bmCtx.strokeStyle=hexToRgba(gc,Math.min(1,go*3.75)); bmCtx.lineWidth=2/BV.scale;
  bmCtx.strokeRect(0,0,BM.cols*C,BM.rows*C);
}

function bmDrawObstacles(){
  const C=BM.cellSize;
  bmCtx.textAlign='center'; bmCtx.textBaseline='middle';
  for(const [k,t] of Object.entries(BM.obstacles)){
    const [cx,cy]=k.split(',').map(Number);
    bmCtx.fillStyle=BM_OBS_FILL[t]||BM_OBS_FILL.mur;
    bmCtx.fillRect(cx*C,cy*C,C,C);
    bmCtx.fillStyle='rgba(255,255,255,.4)';
    bmCtx.font=`${C*.42}px serif`;
    bmCtx.fillText(BM_OBS_ICO[t]||'▪',(cx+.5)*C,(cy+.5)*C);
  }
}

function bmDrawWalls(){
  const C=BM.cellSize;
  bmCtx.strokeStyle='#ddd'; bmCtx.lineWidth=Math.max(2,3/BV.scale); bmCtx.lineCap='square';
  for(const w of BM.walls){
    const [type,x,y]=w.split(':'); const xi=+x,yi=+y;
    bmCtx.beginPath();
    if(type==='h'){ bmCtx.moveTo(xi*C,yi*C); bmCtx.lineTo((xi+1)*C,yi*C); }
    else{ bmCtx.moveTo(xi*C,yi*C); bmCtx.lineTo(xi*C,(yi+1)*C); }
    bmCtx.stroke();
  }
}

function bmDrawTokens(){
  const C=BM.cellSize, R=C*.42;
  const curC = S.combatants[S.turnIdx];
  for(const t of (BM._tokens||[])){
    if(bmDrag&&bmDrag.tok===t) continue;
    const c = S.combatants.find(x=>x.id===t.combId);
    const isActive = curC && t.combId===curC.id;
    const isDead = c && c.pv<=0;
    bmDrawTok(t,(t.cx+.5)*C,(t.cy+.5)*C,R,false,isActive,isDead);
  }
  if(bmDrag){
    bmCtx.globalAlpha=.3;
    bmDrawTok(bmDrag.tok,(bmDrag.tok.cx+.5)*C,(bmDrag.tok.cy+.5)*C,R,false,false,false);
    bmCtx.globalAlpha=1;
    bmDrawTok(bmDrag.tok,bmDrag.wx,bmDrag.wy,R,true,false,false);
    const _tc=bmW2C(bmDrag.wx,bmDrag.wy);
    const _dx=Math.abs(_tc.cx-(bmDrag.startCx??bmDrag.tok.cx)),_dy=Math.abs(_tc.cy-(bmDrag.startCy??bmDrag.tok.cy));
    const _dist=Math.sqrt(_dx*_dx+_dy*_dy);
    if(_dist>0){
      const _m=_dist*1.5; const _lbl=_dist+'c '+(_m%1?_m.toFixed(1):_m)+'m';
      const _fs=Math.max(10,C*.28);
      bmCtx.font='bold '+_fs+'px sans-serif';
      bmCtx.textAlign='center'; bmCtx.textBaseline='bottom';
      bmCtx.fillStyle='rgba(0,0,0,.7)';
      bmCtx.fillText(_lbl,bmDrag.wx+1/BV.scale,bmDrag.wy-R-4/BV.scale+1/BV.scale);
      bmCtx.fillStyle='#ffd700';
      bmCtx.fillText(_lbl,bmDrag.wx,bmDrag.wy-R-4/BV.scale);
    }
  }
}

function bmDrawTok(tok,wx,wy,R,isDrag,isActive,isDead){
  const col=TYPE_C[tok.type]||'#888';
  if(isActive){
    bmCtx.beginPath(); bmCtx.arc(wx,wy,R+5/BV.scale,0,Math.PI*2);
    bmCtx.strokeStyle='#ffd700'; bmCtx.lineWidth=3/BV.scale; bmCtx.stroke();
  }
  if(bmSelTok===tok||isDrag){
    bmCtx.beginPath(); bmCtx.arc(wx,wy,R+3/BV.scale,0,Math.PI*2);
    bmCtx.strokeStyle='#fff'; bmCtx.lineWidth=2/BV.scale; bmCtx.stroke();
  }
  bmCtx.globalAlpha = isDead?0.25:1;
  bmCtx.beginPath(); bmCtx.arc(wx,wy,R,0,Math.PI*2);
  bmCtx.fillStyle=col+'50'; bmCtx.fill();
  bmCtx.strokeStyle=col; bmCtx.lineWidth=2/BV.scale; bmCtx.stroke();
  const lbl=(tok.name||'?').substring(0,5);
  const fs=Math.max(7,R*.55);
  bmCtx.font=`600 ${fs}px 'Cinzel',serif`;
  bmCtx.fillStyle=isDead?'rgba(255,255,255,.25)':'#fff';
  bmCtx.textAlign='center'; bmCtx.textBaseline='middle';
  bmCtx.fillText(lbl,wx,wy);
  bmCtx.globalAlpha=1;
}

// ── BM Coords & helpers ───────────────────────────────────────────────────────
function bmS2W(sx,sy){ return{x:(sx-BV.x)/BV.scale, y:(sy-BV.y)/BV.scale}; }
function bmW2C(wx,wy){ return{cx:Math.floor(wx/BM.cellSize), cy:Math.floor(wy/BM.cellSize)}; }
function bmInBounds(cx,cy){ return cx>=0&&cx<BM.cols&&cy>=0&&cy<BM.rows; }
function bmTokAt(wx,wy){
  const R=BM.cellSize*.42;
  for(let i=(BM._tokens||[]).length-1;i>=0;i--){
    const t=BM._tokens[i];
    if(Math.hypot(wx-(t.cx+.5)*BM.cellSize,wy-(t.cy+.5)*BM.cellSize)<=R) return t;
  }
  return null;
}
function bmGetEdge(wx,wy){
  const C=BM.cellSize,gx=wx/C,gy=wy/C;
  const fx=gx-Math.floor(gx),fy=gy-Math.floor(gy);
  const cx=Math.floor(gx),cy=Math.floor(gy);
  const dH=Math.min(fy,1-fy),dV=Math.min(fx,1-fx);
  if(dH<dV&&dH<.28){const ey=fy<.5?cy:cy+1; if(cx<0||cx>=BM.cols||ey<0||ey>BM.rows)return null; return`h:${cx}:${ey}`;}
  if(dV<=dH&&dV<.28){const ex=fx<.5?cx:cx+1; if(ex<0||ex>BM.cols||cy<0||cy>=BM.rows)return null; return`v:${ex}:${cy}`;}
  return null;
}
function bmToggleWall(k){ if(!k)return; const i=BM.walls.indexOf(k); if(i>=0){BM.walls.splice(i,1);return false;} BM.walls.push(k); return true; }
function bmCycleObs(cx,cy){ const k=`${cx},${cy}`,cur=BM.obstacles[k],idx=BM_OBS_SEQ.indexOf(cur); if(idx===BM_OBS_SEQ.length-1)delete BM.obstacles[k]; else BM.obstacles[k]=BM_OBS_SEQ[idx+1]||BM_OBS_SEQ[0]; }
function bmEraseAt(wx,wy,cx,cy){ const edge=bmGetEdge(wx,wy); if(edge&&BM.walls.includes(edge)){BM.walls.splice(BM.walls.indexOf(edge),1);return;} const k=`${cx},${cy}`; if(k in BM.obstacles) delete BM.obstacles[k]; }

// ── BM Events ─────────────────────────────────────────────────────────────────
function bmOnMouseDown(e){
  e.preventDefault();
  const {x:wx,y:wy}=bmS2W(e.offsetX,e.offsetY);
  const {cx,cy}=bmW2C(wx,wy);
  if(e.button===2||bmSpaceDown){ bmPanning=true; bmPanBase={sx:e.clientX,sy:e.clientY,vx:BV.x,vy:BV.y}; bmCanvas.classList.add('tpan'); return; }
  if(IS_JOUEUR) return;
  if(bmTool==='select'){ const t=bmTokAt(wx,wy); bmSelTok=t||null; if(t) bmDrag={tok:t,wx,wy,startCx:t.cx,startCy:t.cy}; bmRender(); return; }
  if(bmTool==='wall'){ const edge=bmGetEdge(wx,wy); if(edge){bmBrushAdd=!BM.walls.includes(edge);bmBrushed.clear();bmBrushing=true;bmToggleWall(edge);bmBrushed.add(edge);bmRender();bmSaveState();} return; }
  if(bmTool==='obstacle'){ if(bmInBounds(cx,cy)){bmBrushing=true;bmCycleObs(cx,cy);bmRender();bmSaveState();} return; }
  if(bmTool==='eraser'){ bmBrushing=true; bmEraseAt(wx,wy,cx,cy); bmRender(); bmSaveState(); }
}
function bmOnMouseMove(e){
  if(bmPanning){ BV.x=bmPanBase.vx+e.clientX-bmPanBase.sx; BV.y=bmPanBase.vy+e.clientY-bmPanBase.sy; bmRender(); return; }
  const {x:wx,y:wy}=bmS2W(e.offsetX,e.offsetY);
  const {cx,cy}=bmW2C(wx,wy);
  if(bmDrag&&!IS_JOUEUR){ bmDrag.wx=wx; bmDrag.wy=wy; bmRender(); return; }
  if(!bmBrushing||IS_JOUEUR) return;
  if(bmTool==='wall'){ const edge=bmGetEdge(wx,wy); if(edge&&!bmBrushed.has(edge)){bmBrushed.add(edge);if(bmBrushAdd&&!BM.walls.includes(edge))BM.walls.push(edge);else if(!bmBrushAdd){const i=BM.walls.indexOf(edge);if(i>=0)BM.walls.splice(i,1);}bmRender();} }
  else if(bmTool==='obstacle'){ if(bmInBounds(cx,cy)&&!(cx+','+cy in BM.obstacles)){bmCycleObs(cx,cy);bmRender();} }
  else if(bmTool==='eraser'){ bmEraseAt(wx,wy,cx,cy); bmRender(); }
}
function bmOnMouseUp(e){
  bmCanvas.classList.remove('tpan');
  if(bmPanning){ bmPanning=false; return; }
  if(bmDrag&&!IS_JOUEUR){
    const {x:wx,y:wy}=bmS2W(e.offsetX,e.offsetY);
    bmDrag.tok.cx=Math.max(0,Math.min(BM.cols-1,Math.floor(wx/BM.cellSize)));
    bmDrag.tok.cy=Math.max(0,Math.min(BM.rows-1,Math.floor(wy/BM.cellSize)));
    S.bmTokens[bmDrag.tok.combId]={cx:bmDrag.tok.cx, cy:bmDrag.tok.cy};
    const _dd=Math.sqrt(Math.pow(bmDrag.tok.cx-bmDrag.startCx,2)+Math.pow(bmDrag.tok.cy-bmDrag.startCy,2));
    if(!S.bmMoved)S.bmMoved={}; S.bmMoved[bmDrag.tok.combId]=(S.bmMoved[bmDrag.tok.combId]||0)+_dd;
    bmDrag=null; bmRender(); bcSend();
  }
  if(bmBrushing){ bmBrushing=false; bmBrushed.clear(); bmSaveState(); }
}
function bmOnMouseLeave(e){
  bmCanvas.classList.remove('tpan');
  if(bmPanning){ bmPanning=false; return; }
  if(bmDrag&&!IS_JOUEUR){ bmDrag=null; bmRender(); }
  if(bmBrushing){ bmBrushing=false; bmBrushed.clear(); }
}
function bmOnWheel(e){
  e.preventDefault();
  const f=e.deltaY<0?1.12:1/1.12;
  BV.x=e.offsetX-(e.offsetX-BV.x)*f;
  BV.y=e.offsetY-(e.offsetY-BV.y)*f;
  BV.scale=Math.max(.08,Math.min(10,BV.scale*f));
  bmRender();
}
function bmOnDblClick(e){
  if(bmTool!=='select'||IS_JOUEUR) return;
  const {x:wx,y:wy}=bmS2W(e.offsetX,e.offsetY);
  const t=bmTokAt(wx,wy); if(!t) return;
  const n=prompt('Renommer :',t.name);
  if(n!==null&&n.trim()){ t.name=n.trim().substring(0,20); bmRender(); }
}
function bmOnKeyDown(e){
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if(e.code==='Space'){ bmSpaceDown=true; e.preventDefault(); }
  if(!IS_JOUEUR){
    if(e.key==='s'||e.key==='S') bmSetTool('select');
    if(e.key==='w'||e.key==='W') bmSetTool('wall');
    if(e.key==='o'||e.key==='O') bmSetTool('obstacle');
    if(e.key==='e'||e.key==='E') bmSetTool('eraser');
  }
}
function bmOnKeyUp(e){ if(e.code==='Space') bmSpaceDown=false; }

function bmSetTool(t){
  bmTool=t;
  document.querySelectorAll('.bm-tool-btn').forEach(b=>b.classList.remove('on'));
  const b=document.getElementById('bm-tool-'+t); if(b) b.classList.add('on');
  if(!bmCanvas) return;
  bmCanvas.className = ['wall','obstacle','eraser'].includes(t)?'t'+{wall:'crosshair',obstacle:'cell',eraser:'cell'}[t]:'';
}

function bmRenderToolbar(){
  const wrap=document.getElementById('bm-toolbar-wrap'); if(!wrap) return;
  wrap.innerHTML=`
    <button class="bm-tool-btn on" id="bm-tool-select" onclick="bmSetTool('select')" title="Sélection / déplacer (S)"><span class="bm-tool-icon">↖</span>Sel</button>
    <button class="bm-tool-btn" id="bm-tool-wall" onclick="bmSetTool('wall')" title="Tracer murs (W)"><span class="bm-tool-icon">─</span>Mur</button>
    <button class="bm-tool-btn" id="bm-tool-obstacle" onclick="bmSetTool('obstacle')" title="Obstacles (O)"><span class="bm-tool-icon">■</span>Obs</button>
    <button class="bm-tool-btn" id="bm-tool-eraser" onclick="bmSetTool('eraser')" title="Gomme (E)"><span class="bm-tool-icon">✕</span>Eff</button>
    <div class="bm-sep"></div>
    <label style="font-family:var(--font-ui);font-size:.44rem;color:var(--t3)">Grille</label>
    <input type="color" id="bm-grid-color" value="${BM.gridColor||'#ffffff'}"
      oninput="BM.gridColor=this.value;bmRender();bmSaveState()"
      style="width:26px;height:22px;border:1px solid var(--border);border-radius:3px;cursor:pointer;padding:1px;background:transparent">
    <input type="range" min="0" max="100" step="1" value="${Math.round((BM.gridOpacity!=null?BM.gridOpacity:0.08)*100)}"
      oninput="BM.gridOpacity=+this.value/100;bmRender();bmSaveState()"
      title="Opacite grille"
      style="width:55px;accent-color:var(--amber);cursor:pointer">
    <div class="bm-sep"></div>
    <button class="bm-tool-btn" onclick="document.getElementById('bm-bg-file').click()" title="Image de fond">🖼 Fond</button>
    <input type="file" id="bm-bg-file" accept="image/*" style="display:none" onchange="bmOnBgPick(event)">
    <button class="bm-tool-btn" onclick="bmClearBg()" title="Retirer fond">✕bg</button>
    <div class="bm-sep"></div>

    <label style="font-family:var(--font-ui);font-size:.44rem;color:var(--t3)">Échelle</label>

    <input type="range" min="5" max="500" step="5" value="${Math.round((BM.bgScale||1)*100)}" id="bm-bg-scale" oninput="BM.bgScale=+this.value/100;document.getElementById('bm-scale-num').value=this.value;bmRender();bmSaveState()" style="width:70px;accent-color:var(--amber);cursor:pointer">

    <input type="number" min="0.5" max="1000" step="0.5" id="bm-scale-num" value="${Math.round((BM.bgScale||1)*100)}" oninput="const v=Math.max(0.5,Math.min(1000,+this.value||100));BM.bgScale=v/100;document.getElementById('bm-bg-scale').value=v;bmRender();bmSaveState()" style="width:52px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:2px 4px;font-family:var(--font-ui);font-size:.5rem;text-align:right">

    <span style="font-family:var(--font-ui);font-size:.44rem;color:var(--t3)">%</span>
    <div class="bm-sep"></div>
    <button class="bm-tool-btn" onclick="bmClearMap()" title="Effacer murs et obstacles" style="color:#c84a4a;border-color:rgba(200,74,74,.3)">🗑 Carte</button>
    <span style="font-family:var(--font-ui);font-size:.4rem;color:var(--t3);margin-left:4px">Espace+glisser = pan · Molette = zoom</span>`;
}

function bmOnBgPick(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{ BM.bgData=ev.target.result; bmBgImg=new Image(); bmBgImg.onload=()=>bmRender(); bmBgImg.src=BM.bgData; bmSaveState(); };
  r.readAsDataURL(f); e.target.value='';
}
function bmClearBg(){ BM.bgData=null; bmBgImg=null; bmRender(); bmSaveState(); }
function bmClearMap(){ if(!confirm('Effacer murs et obstacles ?')) return; BM.walls=[]; BM.obstacles={}; bmSaveState(); bmRender(); }

// ── TOGGLE BATTLEMAP ──────────────────────────────────────────────────────────
function toggleBM(){
  S.bmOpen=!S.bmOpen;
  const sec=document.getElementById('bm-section');
  const chev=document.getElementById('bm-chevron');
  sec.classList.toggle('open',S.bmOpen);
  if(chev) chev.classList.toggle('open',S.bmOpen);
  if(S.bmOpen){ requestAnimationFrame(()=>requestAnimationFrame(bmResizeCanvas)); setTimeout(bmResizeCanvas,150); }
  bcSend();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async()=>{
  // nav.js appelle injectNav() via son propre DOMContentLoaded — ne pas le rappeler ici
  bcInit();
  if(!IS_JOUEUR){
    try{ allPJs = await loadData('personnages.json').catch(()=>[]) || []; allPJs=allPJs.filter(p=>p.id); }catch(e){ allPJs=[]; }
    try{ allPNJs = await loadData('pnjs.json').catch(()=>[]) || []; }catch(e){ allPNJs=[]; }
    try{ allMonstres = await loadData('monstres.json').catch(()=>[]) || []; }catch(e){ allMonstres=[]; }
    render();
  }
  document.addEventListener('larme-mj-change', ()=>render());
});
</script>
