<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aventuriers &mdash; Story Warden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;0,900;1,400&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════
       TOKENS
    ═══════════════════════════════════════ */
    :root {
      --bg:          #2D2D2D;
      --surface:     #393939;
      --surface-mid: #424242;
      --crimson:     #9E3A44;
      --crimson-dark:#7a2d35;
      --crimson-dim: #4a3035;
      --crimson-bd:  #6b3038;
      --text:        #ECE9E0;
      --text-muted:  #9E9C9A;
      --text-dim:    #797876;
      --border-soft: #484848;
      --sh-topbar:   0 2px 0 var(--crimson);
      --sh-card:     0 0 0 1px var(--crimson-bd), 0 4px 20px #1a1a1a;
      --sh-card-hov: 0 0 0 1px var(--crimson), 0 6px 28px #1c1010;
      --sh-fab:      0 4px 20px var(--crimson-dark);
      --sidebar-w:  288px;
      --band-w:      72px;
      --topbar-h:    84px;
      --item-h:      52px;
      --icon-box:    44px;
      --card-w:     277px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body { min-height: 100%; background: var(--bg); font-family: 'Noto Serif', serif; color: var(--text); display: flex; flex-direction: column; }

    /* ── TOPBAR ── */
    .topbar { position: sticky; top: 0; z-index: 200; height: var(--topbar-h); background: var(--bg); box-shadow: var(--sh-topbar); display: flex; align-items: center; padding: 0 28px; flex-shrink: 0; }
    .topbar-center { flex: 1; display: flex; align-items: center; justify-content: center; }
    .topbar-logo-mask { display: block; width: 160px; height: 40px; background-color: var(--text); mask-image: url(assets/pictos/logo_story_warden.svg); mask-size: contain; mask-repeat: no-repeat; mask-position: center; -webkit-mask-image: url(assets/pictos/logo_story_warden.svg); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; }
    .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    /* Session label */
    #session-btn { height: 34px; padding: 0 14px; background: var(--surface); border: 1px solid var(--crimson-bd); border-radius: 6px; font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 700; color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: border-color .15s, color .15s; }
    #session-btn:hover { border-color: var(--crimson); color: var(--text); }

    /* Settings gear button + dropdown */
    .settings-wrap { position: relative; }
    .btn-settings { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--crimson-bd); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color .15s, background .15s; }
    .btn-settings:hover { background: var(--crimson-dim); border-color: var(--crimson); }
    .btn-settings svg { width: 16px; height: 16px; fill: none; stroke: var(--text-muted); stroke-width: 1.6; stroke-linecap: round; }
    .btn-settings:hover svg { stroke: var(--text); }

    .settings-menu { position: absolute; top: calc(100% + 8px); right: 0; width: 220px; background: var(--surface); border: 1px solid var(--crimson-bd); border-radius: 10px; overflow: hidden; box-shadow: 0 8px 32px #1a1a1a; z-index: 500; display: none; }
    .settings-menu.open { display: block; }

    .settings-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 500; color: var(--text-muted); text-decoration: none; cursor: pointer; transition: background .12s, color .12s; border-bottom: 1px solid var(--border-soft); }
    .settings-item:last-child { border-bottom: none; }
    .settings-item:hover { background: var(--surface-mid); color: var(--text); }

    /* Toggle switch */
    .toggle { width: 36px; height: 20px; background: var(--crimson-dim); border-radius: 10px; position: relative; transition: background .2s; cursor: pointer; border: 1px solid var(--crimson-bd); }
    .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-dim); transition: transform .2s, background .2s; }
    .toggle.on { background: var(--crimson); border-color: var(--crimson); }
    .toggle.on::after { transform: translateX(16px); background: var(--text); }

    /* ── PAGE LAYOUT ── */
    .page-body { display: flex; flex: 1; }

    /* ── SIDEBAR ── */
    .sidebar-wrap { position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); width: var(--band-w); flex-shrink: 0; overflow: hidden; border-radius: 0 16px 16px 0; background: var(--bg); border-right: 1px solid var(--border-soft); transition: width 0.28s cubic-bezier(0.4,0,0.2,1); z-index: 50; }
    .sidebar-wrap:hover { width: var(--sidebar-w); }
    .sidebar { position: relative; width: var(--sidebar-w); min-height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
    .sidebar::-webkit-scrollbar { display: none; }
    .sidebar-band { position: absolute; inset: 0 auto 0 0; width: var(--band-w); background: var(--bg); pointer-events: none; z-index: 0; }
    .sidebar-band::after { content: ''; position: absolute; right: 0; top: 20px; bottom: 20px; width: 1px; background: var(--border-soft); }
    .sidebar-nav { position: relative; z-index: 1; padding: 20px 0; display: flex; flex-direction: column; width: var(--sidebar-w); }
    .nav-item { display: flex; align-items: center; height: var(--item-h); text-decoration: none; color: var(--text-dim); cursor: pointer; transition: color .15s; }
    .nav-item:hover, .nav-item.active { color: var(--text); }
    .nav-icon-area { width: var(--band-w); height: var(--item-h); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .nav-icon-pill { width: var(--icon-box); height: var(--icon-box); display: flex; align-items: center; justify-content: center; border-radius: 10px; transition: background .15s; }
    /* Solid crimson pill on hover/active */
    .nav-item.active .nav-icon-pill,
    .nav-item:hover  .nav-icon-pill { background: var(--crimson); }
    /* Icon color: beige on active/hover */
    .nav-ico { display: block; background-color: var(--text-dim); mask-repeat: no-repeat; mask-position: center; mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; -webkit-mask-size: contain; flex-shrink: 0; transition: background-color .15s; }
    .nav-item:hover  .nav-ico,
    .nav-item.active .nav-ico { background-color: var(--text); }
    .nav-label-area { flex: 1; height: var(--item-h); display: flex; align-items: center; justify-content: center; border-radius: 10px; padding: 0 8px; transition: background .15s; }
    /* Label area: solid crimson bg on hover only (not active) */
    .nav-item:hover .nav-label-area { background: var(--crimson); }
    .nav-label { font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 500; white-space: nowrap; line-height: 1; text-align: center; opacity: 0; transition: opacity .15s ease .1s; color: var(--text-muted); }
    /* Beige text on label when sidebar expanded + hover */
    .sidebar-wrap:hover .nav-label { opacity: 1; }
    .nav-item:hover .nav-label { color: var(--text); }

    /* ── MAIN ── */
    .main { flex: 1; min-width: 0; padding: 36px 40px 100px; }
    .page-header { margin-bottom: 24px; }
    .page-title { font-family: 'Noto Serif', serif; font-size: 28px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; line-height: 1.1; margin-bottom: 6px; }
    .page-title span { color: var(--crimson); font-weight: 900; }
    .page-sub { font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 500; color: var(--text-dim); letter-spacing: .06em; text-transform: uppercase; }
    .bento { display: flex; flex-direction: column; gap: 32px; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr)); gap: 20px; }

    /* ── CARD ── */
    .char-card { width: var(--card-w); background: var(--surface); border-radius: 12px; box-shadow: var(--sh-card); display: flex; flex-direction: column; overflow: hidden; transition: box-shadow .25s, transform .2s; animation: cardIn .4s ease both; }
    .char-card:hover { box-shadow: var(--sh-card-hov); transform: translateY(-2px); }
    @keyframes cardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .card-head-band { height: 3px; background: var(--crimson); flex-shrink: 0; }
    .char-card.absent .card-head-band { background: var(--border-soft); }
    .card-body { padding: 16px; display: flex; flex-direction: column; gap: 13px; flex: 1; }
    .card-top { display: flex; gap: 12px; align-items: flex-start; }
    .card-portrait { width: 72px; height: 88px; flex-shrink: 0; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-soft); background: var(--bg); }
    .card-portrait-ph { width: 72px; height: 88px; flex-shrink: 0; border-radius: 8px; border: 1px solid var(--border-soft); background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--text-dim); }
    .card-identity { flex: 1; min-width: 0; padding-top: 2px; display: flex; flex-direction: column; gap: 5px; }

    /* Level badge — solid crimson, beige text */
    .level-badge { display: inline-flex; align-items: center; background: var(--crimson); border-radius: 4px; padding: 2px 7px; font-family: 'Manrope', sans-serif; font-size: 9px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: .08em; width: fit-content; }

    .card-name { font-family: 'Noto Serif', serif; font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.1; }
    .card-class { font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 500; color: var(--text-muted); line-height: 1.2; }
    .hp-section { display: flex; flex-direction: column; gap: 5px; }
    .hp-row { display: flex; align-items: baseline; justify-content: space-between; }
    .hp-label { font-family: 'Manrope', sans-serif; font-size: 9px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
    .hp-value { font-family: 'Noto Serif', serif; font-size: 13px; font-weight: 700; color: var(--text-muted); }
    .hp-value strong { font-size: 17px; font-weight: 900; color: var(--text); }
    .hp-bar { width: 100%; height: 4px; background: var(--bg); border-radius: 9999px; overflow: hidden; }
    .hp-fill { height: 100%; border-radius: 9999px; background: var(--crimson); }
    .hp-fill.low { background: #c04040; }
    .hp-fill.crit { background: #8a2020; }
    .card-stats { display: flex; gap: 8px; }
    .stat-box { flex: 1; height: 54px; background: var(--bg); border-radius: 6px; border: 1px solid var(--border-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .stat-lbl { font-family: 'Manrope', sans-serif; font-size: 9px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; }
    .stat-val { font-family: 'Noto Serif', serif; font-size: 17px; font-weight: 900; color: var(--text); line-height: 1; }
    .card-attrs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .attr-box { background: var(--bg); border: 1px solid var(--border-soft); border-radius: 6px; padding: 5px 4px; text-align: center; }
    .attr-name { font-family: 'Manrope', sans-serif; font-size: 8px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; display: block; }
    .attr-score { font-family: 'Noto Serif', serif; font-size: 14px; font-weight: 900; color: var(--text); line-height: 1.1; display: block; }
    .attr-mod { font-family: 'Manrope', sans-serif; font-size: 9px; font-weight: 700; color: var(--text-muted); line-height: 1; display: block; }
    .card-footer { padding: 10px 16px; border-top: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .card-status-label { font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 500; color: var(--text-dim); }
    .card-status-label.is-active { color: #a8d4a0; }

    /* Fiche button */
    .btn-fiche { height: 28px; padding: 0 12px; background: var(--surface-mid); border: 1px solid var(--crimson-bd); border-radius: 5px; font-family: 'Manrope', sans-serif; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
    .btn-fiche:hover { background: var(--crimson); border-color: var(--crimson); color: var(--text); }
    .char-card.absent { opacity: .45; }
    .loading { font-family: 'Manrope', sans-serif; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); padding: 40px 0; grid-column: 1/-1; }

    /* ── NOTES AREA ── */
    .notes-area { display: flex; gap: 20px; align-items: stretch; }
    .notes-left { width: var(--card-w); flex-shrink: 0; background: var(--crimson); border-radius: 12px; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
    .notes-left-title { font-family: 'Noto Serif', serif; font-size: 13px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid var(--crimson-dark); padding-bottom: 10px; }
    .session-info { display: flex; flex-direction: column; gap: 12px; }
    .session-item { display: flex; flex-direction: column; gap: 3px; }
    .session-key { font-family: 'Manrope', sans-serif; font-size: 9px; font-weight: 700; color: #c4bfba; text-transform: uppercase; letter-spacing: .1em; }
    .session-val { font-family: 'Noto Serif', serif; font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.2; }
    .session-divider { height: 1px; background: var(--crimson-dark); }
    .notes-right { flex: 1; min-width: 0; background: var(--surface); border-radius: 12px; border: 1px solid var(--border-soft); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .notes-right-title { font-family: 'Noto Serif', serif; font-size: 15px; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--border-soft); padding-bottom: 12px; }
    .note-card { background: var(--surface-mid); border-radius: 8px; padding: 11px 14px; border-left: 2px solid var(--crimson); }
    .note-card.note-warn { border-left-color: #c47a30; }
    .note-card.note-info { border-left-color: #4a8a6a; }
    .note-tag { font-family: 'Manrope', sans-serif; font-size: 9px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 5px; }
    .note-content { font-family: 'Noto Serif', serif; font-size: 13px; font-weight: 400; color: var(--text-muted); line-height: 1.55; }

    /* ── FAB ── */
    .fab { position: fixed; right: 32px; bottom: 36px; width: 64px; height: 64px; background: var(--crimson); border-radius: 9999px; box-shadow: var(--sh-fab); display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; transition: transform .2s, background .2s; z-index: 100; }
    .fab:hover { transform: scale(1.08); background: var(--crimson-dark); }

    /* ═══════════════════════════════════════
       MODAL — CHARACTER SHEET
    ═══════════════════════════════════════ */
    .sheet-overlay { position: fixed; inset: 0; background: #0a0a0a; z-index: 300; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px 20px; opacity: 0; pointer-events: none; transition: opacity .22s; }
    .sheet-overlay.open { opacity: 1; pointer-events: auto; }
    .sheet-container { width: 100%; max-width: 920px; background: var(--surface); border-radius: 16px; border: 1px solid var(--crimson-bd); overflow: hidden; position: relative; box-shadow: 0 24px 80px #080808; }
    .sheet-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; background: var(--surface-mid); border: 1px solid var(--border-soft); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 200; transition: background .15s, border-color .15s; }
    .sheet-close:hover { background: var(--crimson); border-color: var(--crimson); }
    .sheet-close svg { width: 14px; height: 14px; stroke: var(--text-muted); stroke-width: 2; stroke-linecap: round; }
    .sheet-close:hover svg { stroke: var(--text); }
    .sheet-content { padding: 0; }
    .sheet-content-inner { padding: 24px 28px 40px; }

    /* Hero band */
    .sheet-hero { display: flex; gap: 20px; align-items: flex-start; padding-bottom: 20px; border-bottom: 1px solid var(--border-soft); margin-bottom: 20px; }
    .sheet-portrait { width: 110px; height: 130px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border-soft); flex-shrink: 0; }
    .sheet-portrait-ph { width: 110px; height: 130px; border-radius: 10px; border: 1px solid var(--border-soft); background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--text-dim); flex-shrink: 0; }
    .sheet-hero-info { flex: 1; min-width: 0; padding-top: 4px; }
    .sheet-name { font-family: 'Noto Serif', serif; font-size: 30px; font-weight: 900; color: var(--text); line-height: 1; margin-bottom: 6px; }
    .sheet-class { font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; }
    .sheet-meta { font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 500; color: var(--text-dim); margin-bottom: 8px; }
    .sheet-align { display: inline-block; font-family: 'Manrope', sans-serif; font-size: 10px; font-weight: 700; background: var(--crimson); color: var(--text); border-radius: 4px; padding: 3px 8px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
    .sheet-quote { font-family: 'Noto Serif', serif; font-size: 13px; font-style: italic; color: var(--text-dim); line-height: 1.5; }

    /* Attribute row */
    .sheet-attrs-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .sheet-attr { flex: 1; background: var(--bg); border-radius: 8px; border: 1px solid var(--border-soft); padding: 10px 4px; text-align: center; }
    .sheet-attr-lbl { font-family: 'Manrope', sans-serif; font-size: 9px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; display: block; margin-bottom: 4px; }
    .sheet-attr-val { font-family: 'Noto Serif', serif; font-size: 22px; font-weight: 900; color: var(--text); line-height: 1; display: block; }
    .sheet-attr-mod { font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 700; color: var(--crimson); line-height: 1.4; display: block; }

    /* Combat row */
    .sheet-combat-row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 20px; }
    .sheet-hp-block { flex: 2; min-width: 0; background: var(--bg); border-radius: 8px; border: 1px solid var(--border-soft); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
    .sheet-hp-label { font-family: 'Manrope', sans-serif; font-size: 9px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
    .sheet-hp-val { font-family: 'Noto Serif', serif; font-size: 20px; font-weight: 900; color: var(--text); }
    .hp-temp { font-size: 12px; font-weight: 400; color: var(--text-dim); font-family: 'Manrope', sans-serif; }
    .sheet-hp-bar { width: 100%; height: 5px; background: var(--surface); border-radius: 9999px; overflow: hidden; }
    .sheet-hp-fill { height: 100%; border-radius: 9999px; background: var(--crimson); }
    .sheet-stat-pill { flex: 1; background: var(--bg); border-radius: 8px; border: 1px solid var(--border-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px; }
    .ssp-lbl { font-family: 'Manrope', sans-serif; font-size: 8px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
    .ssp-val { font-family: 'Noto Serif', serif; font-size: 16px; font-weight: 900; color: var(--text); line-height: 1; }

    /* Two-column body */
    .sheet-body { display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
    .sheet-col-left, .sheet-col-right { display: flex; flex-direction: column; gap: 16px; }
    .sheet-section { background: var(--bg); border-radius: 8px; border: 1px solid var(--border-soft); padding: 12px 14px; }
    .sheet-section-title { font-family: 'Manrope', sans-serif; font-size: 9px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; border-bottom: 1px solid var(--border-soft); padding-bottom: 6px; }

    /* Saves */
    .sheet-saves { display: flex; flex-direction: column; gap: 4px; }
    .sheet-save { font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 500; color: var(--text-dim); display: flex; justify-content: space-between; }
    .sheet-save.prof { color: var(--text-muted); font-weight: 700; }

    /* Skills */
    .sheet-skills { display: flex; flex-direction: column; gap: 3px; }
    .sheet-skill { font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 500; color: var(--text-dim); display: flex; align-items: center; gap: 6px; padding: 1px 0; }
    .sheet-skill.prof { color: var(--text-muted); }
    .sheet-skill.expert { color: var(--text); }
    .skill-mark { width: 12px; flex-shrink: 0; text-align: center; font-size: 10px; color: var(--text-dim); }
    .sheet-skill.prof .skill-mark { color: var(--text-muted); }
    .sheet-skill.expert .skill-mark { color: var(--crimson); }
    .skill-name { flex: 1; }
    .skill-bonus { font-family: 'Noto Serif', serif; font-size: 12px; font-weight: 700; color: var(--text-muted); }
    .sheet-skill.expert .skill-bonus { color: var(--text); }

    /* Attacks */
    .sheet-attack { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border-soft); }

<script>
(function() {
  /* ── Helpers ── */
  function s(n) { return n >= 0 ? '+' + n : '' + n; }

  var SKILL_ATTR = {
    'Acrobaties':'DEX','Arcanes':'INT','Athl\u00e9tisme':'FOR',
    'Discr\u00e9tion':'DEX','Dressage':'SAG','Escamotage':'DEX',
    'Histoire':'INT','Intimidation':'CHA','Investigation':'INT',
    'M\u00e9decine':'SAG','Nature':'INT','Perception':'SAG',
    'Perspicacit\u00e9':'SAG','Persuasion':'CHA','Religion':'INT',
    'Repr\u00e9sentation':'CHA','Survie':'SAG','Tromperie':'CHA'
  };

  /* Read attributs safely — handles {val,mod} objects */
  function getAttr(pj, key) {
    if (!pj.attributs) return null;
    var _attrAlias = { FOR: 'STR', SAG: 'WIS' }; var a = pj.attributs[key] || (_attrAlias[key] ? pj.attributs[_attrAlias[key]] : null);
    if (a == null) return null;
    if (typeof a === 'object') return a;          /* {val, mod} */
    return { val: a, mod: Math.floor((a - 10) / 2) }; /* fallback if raw score */
  }
  function attrMod(pj, key) { var a = getAttr(pj, key); return a ? a.mod : 0; }
  function attrVal(pj, key) { var a = getAttr(pj, key); return a ? a.val : null; }

  function strField(v) { return (v && typeof v === 'object') ? (v.nom || JSON.stringify(v)) : (v || ''); }

  function hpPct(pj) {
    var cur = parseInt(pj.pv_actuels != null ? pj.pv_actuels : pj.pv) || 0;
    var max = parseInt(pj.pv_max) || cur || 1;
    return Math.min(100, Math.round(cur / max * 100));
  }
  function hpFill(pct) { return pct <= 25 ? ' crit' : pct <= 50 ? ' low' : ''; }

  /* ── Card attribute block ── */
  function attrBlock(label, key, pj) {
    var a = getAttr(pj, key);
    if (a != null) {
      return '<div class="attr-box"><span class="attr-name">' + label + '</span>'
        + '<span class="attr-score">' + a.val + '</span>'
        + '<span class="attr-mod">' + s(a.mod) + '</span></div>';
    }
    return '<div class="attr-box"><span class="attr-name">' + label + '</span>'
      + '<span class="attr-score" style="font-size:12px;color:var(--text-dim)">&mdash;</span>'
      + '<span class="attr-mod">&nbsp;</span></div>';
  }

  /* ── Card renderer ── */
  function renderCard(pj, idx) {
    var absent = pj.statut_campagne === 'absent';
    var portrait = pj.portrait_url
      ? '<img class="card-portrait" src="' + pj.portrait_url + '" alt="' + pj.nom + '" loading="lazy" onclick="openPortraitLightbox(this.src,this.alt)" style="cursor:zoom-in">'
      : '<div class="card-portrait-ph">&#9876;</div>';

    var badge = pj.niveau ? '<span class="level-badge">Niv.\u00a0' + pj.niveau + '</span>' : '';
    var className = strField(pj.classe);
    var raceName  = strField(pj.race);
    var classLine = [raceName, className].filter(Boolean).join(' &bull; ');

    var pv    = pj.pv_actuels != null ? pj.pv_actuels : (pj.pv != null ? pj.pv : '&mdash;');
    var pvMax = pj.pv_max != null ? pj.pv_max : null;
    var pvDisplay = pvMax ? '<strong>' + pv + '</strong>&thinsp;/&thinsp;' + pvMax : '<strong>' + pv + '</strong>';
    var pct = hpPct(pj);

    var ca   = pj.ca != null ? pj.ca : '&mdash;';
    var init = pj.initiative != null ? s(pj.initiative) : '&mdash;';
    var vit  = pj.vitesse != null
      ? ('' + pj.vitesse).replace(/\s*m$/, '') + '<small style="font-size:9px;font-weight:400;color:var(--text-dim)"> m</small>'
      : '&mdash;';

    var bm = pj.bonus_maitrise != null ? (pj.bonus_maitrise >= 0 ? '+' + pj.bonus_maitrise : '' + pj.bonus_maitrise) : '&mdash;';
    var pp = pj.perception_passive != null ? pj.perception_passive : '&mdash;';

    var statusLabel = absent ? 'Absent' : 'Actif';
    var statusClass = absent ? '' : ' is-active';

    return '<div class="char-card' + (absent ? ' absent' : '') + '" style="animation-delay:' + (idx * 50) + 'ms" data-idx="' + idx + '">'
      + '<div class="card-head-band"></div>'
      + '<div class="card-body">'
      +   '<div class="card-top">' + portrait
      +     '<div class="card-identity">' + badge
      +       '<div class="card-name">' + pj.nom + '</div>'
      +       (classLine ? '<div class="card-class">' + classLine + '</div>' : '')
      +     '</div>'
      +   '</div>'
      +   '<div class="hp-section"><div class="hp-row"><span class="hp-label">Points de Vie</span><span class="hp-value">' + pvDisplay + '</span></div>'
      +   '<div class="hp-bar"><div class="hp-fill' + hpFill(pct) + '" style="width:' + pct + '%"></div></div></div>'
      +   '<div class="card-stats">'
      +     '<div class="stat-box"><span class="stat-lbl">CA</span><span class="stat-val">' + ca + '</span></div>'
      +     '<div class="stat-box"><span class="stat-lbl">Init</span><span class="stat-val">' + init + '</span></div>'
      +     '<div class="stat-box"><span class="stat-lbl">Vit.</span><span class="stat-val">' + vit + '</span></div>'
      +   '</div>'
      +   '<div class="card-bm-pp">'
      +     '<div class="stat-box" style="flex:1"><span class="stat-lbl">Ma\u00eetrise</span><span class="stat-val" style="font-size:15px">' + bm + '</span></div>'
      +     '<div class="stat-box" style="flex:1"><span class="stat-lbl">PP</span><span class="stat-val" style="font-size:15px">' + pp + '</span></div>'
      +   '</div>'
      + '</div>'
      + '<div class="card-footer">'
      +   '<span class="card-status-label' + statusClass + '">' + statusLabel + '</span>'
      +   '<button class="btn-fiche" onclick="openSheet(' + idx + ')">Fiche &rarr;</button>'
      + '</div>'
      + '</div>';
  }
  /* CHARACTER SHEET RENDERER */
  var ICO = '../pictos/tw-dnd/icons/';

  function mkIco(path, color, size) {
    var c = color || 'var(--text-dim)';
    var sz = (size || 14) + 'px';
    return '<span style="display:block;width:' + sz + ';height:' + sz + ';flex-shrink:0;background-color:' + c + ';mask-image:url(' + ICO + path + ');mask-size:contain;mask-repeat:no-repeat;mask-position:center;-webkit-mask-image:url(' + ICO + path + ');-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center"></span>';
  }

  function capItem(c, uid) {
    var rechargeLabel = '';
    if (c.recharge) {
      var r = ('' + c.recharge).trim();
      if (/^rc/i.test(r)) rechargeLabel = 'Repos court';
      else if (/^rl/i.test(r)) rechargeLabel = 'Repos long';
      else if (/full/i.test(r)) rechargeLabel = 'Repos long (complet)';
      else if (/aube/i.test(r)) rechargeLabel = 'Au lever du soleil';
      else rechargeLabel = r;
    }
    var usesLine = '';
    if (c.utilisations) {
      usesLine = '<div class="cap2-uses-info">Utilisations\u00a0: ' + c.utilisations + (rechargeLabel ? ' \u2014 Recharge\u00a0: ' + rechargeLabel : '') + '</div>';
    }
    var h = '<div class="cap2" id="' + uid + '">';
    h += '<div class="cap2-head" onclick="toggleCap(\'' + uid + '\')">';
    h += '<svg width="9" height="6" viewBox="0 0 9 6" fill="none" style="flex-shrink:0;stroke:var(--text-dim);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s"><polyline points="1,1 4.5,5 8,1"/></svg>';
    h += '<span class="cap2-name">' + c.nom + '</span>';
    h += '<div class="cap2-tags">' + (c.valeur ? '<span class="cap2-tag">' + c.valeur + '</span>' : '') + '</div></div>';
    h += '<div class="cap2-body">';
    h += (c.chips && c.chips.length ? '<div class="cap2-chips">' + c.chips.map(function(ch) { return '<span class="cap2-chip">' + ch + '</span>'; }).join('') + '</div>' : '');
    h += (c.description ? '<div class="cap2-desc">' + c.description + '</div>' : '<div class="cap2-desc" style="color:var(--text-dim);font-style:italic">Aucune description.</div>');
    h += usesLine;
    h += '</div></div>';
    return h;
  }

  function renderSheet(pj) {
    var portrait = pj.portrait_url
      ? '<img class="sheet-portrait" src="' + pj.portrait_url + '" alt="' + pj.nom + '">'
      : '<div class="sheet-portrait-ph">&#9876;</div>';
    var className  = strField(pj.classe);
    var raceName   = strField(pj.race);
    var classeLine = className + (pj.niveau ? ' Niv.\u00a0' + pj.niveau : '');
    if (pj.sous_classe) classeLine += '\u00a0\u2014\u00a0' + pj.sous_classe;
    var meta = [raceName, pj.background].filter(Boolean).join(' \u00b7 ');
    var pvCur = parseInt(pj.pv_actuels != null ? pj.pv_actuels : pj.pv) || 0;
    var pvMax = parseInt(pj.pv_max) || pvCur || 1;
    var pct   = Math.min(100, Math.round(pvCur / pvMax * 100));
    var bm    = pj.bonus_maitrise || 0;

    /* ACTIONS BAR (no print, close button on right) */
    var actBar = '<div class="sheet-actions-bar">'
      + '<button class="btn-sheet-action" id="sh-btn-pdf-lite">'
      + mkIco('entity/book.svg','var(--text-muted)',13) + 'PDF Lite</button>'
      + '<button class="btn-sheet-action" id="sh-btn-pdf-5e">'
      + mkIco('game/adventure-book.svg','var(--text-muted)',13) + 'PDF 5e Complet</button>'
      + '<button class="btn-sheet-action" onclick="openSheetNewTab()">'
      + mkIco('util/star.svg','var(--text-muted)',13) + 'Nouvel onglet</button>'
      + '<div style="flex:1"></div>'
      + '<button class="btn-sheet-action" onclick="closeSheet()" style="padding:0 10px" title="Fermer">&#10005;</button>'
      + '</div>';

    /* HERO BAND */
    var inspClass = pj.inspiration ? 'active' : 'inactive';
    var inspLabel = pj.inspiration ? '\u2605 Inspiration' : '\u25cb Inspiration';
    var heroMeta = '<div class="sheet-insp ' + inspClass + '" onclick="toggleInspiration()">' + inspLabel + '</div>'
      + '<div class="sheet-class">' + classeLine + '</div>'
      + '<div class="sheet-meta">' + meta + '</div>';
    if (pj.xp != null && pj.xp !== '') heroMeta += '<div class="sheet-tag-row" style="margin:5px 0"><span class="sheet-tag">' + pj.xp + ' XP</span></div>';
    if (pj.alignement) heroMeta += '<div class="sheet-align">' + pj.alignement + '</div>';
    if (pj.citation) heroMeta += '<div class="sheet-quote">&ldquo;' + pj.citation + '&rdquo;</div>';
    var heroBand = '<div class="sheet-hero">' + portrait
      + '<div class="sheet-hero-info"><div class="sheet-name">' + pj.nom + '</div>' + heroMeta + '</div>'
      + '<div class="sheet-dice"><div class="dr-lbl">Lancer de d&eacute;s</div><div class="dr-grid"><button class="dr-btn" onclick="rollDie(4)">d4</button><button class="dr-btn" onclick="rollDie(6)">d6</button><button class="dr-btn" onclick="rollDie(8)">d8</button><button class="dr-btn" onclick="rollDie(10)">d10</button><button class="dr-btn" onclick="rollDie(12)">d12</button><button class="dr-btn" onclick="rollDie(20)">d20</button><button class="dr-btn dr-d100" onclick="rollDie(100)">d%</button></div><div class="dr-res">&mdash;</div></div>'
      + '</div>';

    /* STAT GROUPS */
    var abilityMap = { FOR:'ability/strength.svg', DEX:'ability/dexterity.svg', CON:'ability/constitution.svg', INT:'ability/intelligence.svg', SAG:'ability/wisdom.svg', CHA:'ability/charisma.svg' };
    var abilitiesHtml = '<div class="sheet-sg sheet-sg-abilities"><div class="sheet-sg-title">Caract\u00e9ristiques</div><div class="sheet-sg-attrs">';
    ['FOR','DEX','CON','INT','SAG','CHA'].forEach(function(k) {
      var a = getAttr(pj, k);
      abilitiesHtml += '<div class="sheet-a2">'
        + '<span class="sheet-a2-ico" style="mask-image:url(' + ICO + abilityMap[k] + ');-webkit-mask-image:url(' + ICO + abilityMap[k] + ')"></span>'
        + '<span class="sheet-a2-lbl">' + k + '</span>'
        + '<span class="sheet-a2-val">' + (a ? a.val : '\u2014') + '</span>'
        + '<span class="sheet-a2-mod">' + (a ? s(a.mod) : '\u2014') + '</span>'
        + '</div>';
    });
    abilitiesHtml += '</div></div>';

    var combatHtml = '<div class="sheet-sg"><div class="sheet-sg-title">Combat</div><div class="sheet-sg-combat-inner">'
      + '<div class="sheet-cstat"><span class="cstat-ico" style="mask-image:url(' + ICO + 'attribute/ac.svg);-webkit-mask-image:url(' + ICO + 'attribute/ac.svg)"></span><span class="cstat-lbl">CA</span><div class="cstat-val">' + (pj.ca || '\u2014') + '</div></div>'
      + '<div class="sheet-cstat"><span class="cstat-ico" style="mask-image:url(' + ICO + 'combat/initiative.svg);-webkit-mask-image:url(' + ICO + 'combat/initiative.svg)"></span><span class="cstat-lbl">Initiative</span><div class="cstat-val">' + (pj.initiative != null ? s(pj.initiative) : '\u2014') + '</div></div>'
      + '<div class="sheet-cstat"><span class="cstat-ico" style="mask-image:url(' + ICO + 'movement/walking.svg);-webkit-mask-image:url(' + ICO + 'movement/walking.svg)"></span><span class="cstat-lbl">Vitesse</span><div class="cstat-val">' + (pj.vitesse || '\u2014') + '</div></div>'
      + '</div></div>';

    var pvTempVal = parseInt(pj.pv_temporaires) || 0;
    var pctTemp = pvMax > 0 ? Math.min(100, Math.round(pvTempVal / pvMax * 100)) : 0;
    var dvStr = pj.de_vie || null;
    var hpHtml = '<div class="sheet-sg"><div class="sheet-sg-title">Points de vie</div><div class="sheet-sg-hp-inner">'
      + '<div class="sheet-hp3"><div class="hp3-head">'
      + mkIco('hp/full.svg','var(--crimson)',13)
      + '<span class="hp3-lbl">PV</span>'
      + '<div class="hp3-ctrl">'
      + '<button class="btn-hp" onclick="adjustHP(-1)">-</button>'
      + '<span class="hp3-val" id="sh-pv-cur">' + pvCur + '</span>'
      + '<span class="hp3-max">&thinsp;/ ' + pvMax + '</span>'
      + '<button class="btn-hp" onclick="adjustHP(1)">+</button>'
      + '</div></div>'
      + '<div class="hp3-bar"><div class="hp3-fill' + hpFill(pct) + '" id="sh-pv-bar" style="width:' + pct + '%"></div></div>'
      + '</div>'
      + '<div class="sheet-hp3-temp">'
      + mkIco('hp/temp.svg','#7ab8d4',13)
      + '<span class="hp3-temp-lbl">PV Temp</span>'
      + '<button class="btn-hp" onclick="adjustPVTemp(-1)" style="margin-left:auto">-</button>'
      + '<span class="hp3-temp-val" id="sh-pvt-cur">' + (pvTempVal || '\u2014') + '</span>'
      + '<button class="btn-hp" onclick="adjustPVTemp(1)">+</button>'
      + '</div>'
      + (dvStr ? '<div class="sheet-hp3-temp" style="gap:6px;margin-top:2px">'
        + mkIco('dice/d' + (dvStr.replace('d','').trim() || '8') + '.svg','var(--text-dim)',13)
        + '<span class="hp3-temp-lbl">D\u00e9 de vie</span>'
        + '<span class="hp3-temp-val" style="color:var(--text-muted)">' + dvStr + '</span></div>' : '')
      + '</div></div>';

    var statGroups = '<div class="sheet-stat-groups">' + abilitiesHtml + combatHtml + hpHtml + '</div>';

    /* SAVES */
    var _en2fr = { STR:'FOR', WIS:'SAG' }; var saves = (pj.jets_sauvegarde || pj.jets_de_sauvegarde || []).map(function(k) { return _en2fr[k] || k; });
    var savesHtml = ['FOR','DEX','CON','INT','SAG','CHA'].map(function(k) {
      var m = attrMod(pj, k); var prof = saves.indexOf(k) >= 0;
      return '<div class="sheet-save' + (prof ? ' prof' : '') + '">' + (prof ? '&#9679;' : '&#9675;') + ' ' + k + '&ensp;' + s(prof ? m + bm : m) + '</div>';
    }).join('');

    /* SKILLS */
    var compMap = {};
    (pj.competences || []).forEach(function(c) { compMap[c.nom] = c; });
    var skillsHtml = Object.keys(SKILL_ATTR).sort().map(function(sk) {
      var c = compMap[sk]; var base = attrMod(pj, SKILL_ATTR[sk]);
      var bonus = c ? c.bonus : base;
      var mark = c ? (c.expertise ? '\u2605' : '\u25cf') : '\u25cb';
      var cls  = c ? (c.expertise ? ' expert' : ' prof') : '';
      return '<div class="sheet-skill' + cls + '"><span class="skill-mark">' + mark + '</span><span class="skill-name">' + sk + '</span><span class="skill-bonus">' + s(bonus) + '</span></div>';
    }).join('');

    var legend = '<div class="prof-legend">'
      + '<div class="prof-legend-item"><span style="color:var(--text-dim)">\u25cb</span>\u00a0Non ma\u00eetris\u00e9</div>'
      + '<div class="prof-legend-item"><span style="color:var(--text-muted)">\u25cf</span>\u00a0Ma\u00eetris\u00e9</div>'
      + '<div class="prof-legend-item"><span style="color:var(--crimson)">\u2605</span>\u00a0Expertise</div>'
      + '</div>';

    var bmPp = '<div class="bm-pp-row">'
      + '<div class="bm-pp-box">' + mkIco('attribute/bonus.svg','var(--text-dim)',14) + '<span class="bm-pp-lbl">Ma\u00eetrise</span><span class="bm-pp-val">' + (bm ? s(bm) : '\u2014') + '</span></div>'
      + '<div class="bm-pp-box">' + mkIco('attribute/vision.svg','var(--text-dim)',14) + '<span class="bm-pp-lbl">PP</span><span class="bm-pp-val">' + (pj.perception_passive || '\u2014') + '</span></div>'
      + '</div>';

    /* MONEY â€” always show if argent field exists, â€” for 0 */
    var argent = pj.argent;
    var coin = function(lbl, cls, v) {
      return '<div class="coin-box"><span class="coin-lbl ' + cls + '">' + lbl + '</span><span class="coin-val">' + (v > 0 ? v : '\u2014') + '</span></div>';
    };
    var moneyHtml = argent ? '<div class="sheet-section"><div class="sheet-section-title">Argent</div><div class="sheet-money">'
      + coin('PO','coin-po', argent.po || 0)
      + coin('PA','coin-pa', argent.pa || 0)
      + coin('PE','coin-pe', argent.pe || 0)
      + coin('PC','coin-pc', argent.pc || 0)
      + coin('PP','coin-pp', argent.pp || 0)
      + '</div></div>' : '';

    /* ATTACKS â€” only damage (valeur), no jet */
    var attacksHtml = '';
    if (pj.attaques && pj.attaques.length) {
      attacksHtml = '<div class="sheet-section"><div class="sheet-section-title">Attaques</div>'
        + pj.attaques.map(function(a) {
          return '<div class="sheet-attack"><span class="attack-name">' + a.nom + '</span>'
            + (a.valeur ? '<span class="attack-dmg">' + a.valeur + '</span>' : '') + '</div>';
        }).join('') + '</div>';
    }

    /* CAPACITES */
    var caps = (pj.capacites || []).concat(pj.sorts_mineurs || []);
    var capsHtml = caps.length ? '<div class="sheet-section"><div class="sheet-section-title">Capacit\u00e9s &amp; Sorts</div>'
      + caps.map(function(c, i) { return capItem(c, 'cap_' + i); }).join('') + '</div>' : '';

    var passifsHtml = (pj.passifs && pj.passifs.length) ? '<div class="sheet-section"><div class="sheet-section-title">Passifs</div>'
      + pj.passifs.map(function(c, i) { return capItem(c, 'pas_' + i); }).join('') + '</div>' : '';

    var sortsDndHtml = '';
    if (pj.sorts_dnd) {
      var sdRows = '';
      Object.keys(pj.sorts_dnd).sort().forEach(function(lv) {
        var lst = pj.sorts_dnd[lv] || [];
        if (lst.length) {
          sdRows += '<div style="font-family:\'Manrope\',sans-serif;font-size:9px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin:6px 0 3px">'
            + (lv === '0' ? 'Sorts mineurs' : 'Niveau ' + lv) + '</div>'
            + lst.map(function(c, i) { return capItem(c, 'sd' + lv + '_' + i); }).join('');
        }
      });
      if (sdRows) sortsDndHtml = '<div class="sheet-section"><div class="sheet-section-title">Sorts D&amp;D</div>' + sdRows + '</div>';
    }

    var actionsHtml = '';
    if (pj.actions_bonus || pj.reaction) {
      actionsHtml = '<div class="sheet-section">';
      if (pj.actions_bonus) actionsHtml += '<div class="sheet-section-title">Action bonus</div><div class="sheet-trait">' + pj.actions_bonus + '</div>';
      if (pj.reaction) actionsHtml += '<div class="sheet-section-title" style="margin-top:' + (pj.actions_bonus ? '10px' : '0') + '">R\u00e9action</div><div class="sheet-trait">' + pj.reaction + '</div>';
      actionsHtml += '</div>';
    }

    var equipHtml = (pj.equipement && pj.equipement.length)
      ? '<div class="sheet-section"><div class="sheet-section-title">\u00c9quipement</div><div class="sheet-equip">'
        + pj.equipement.map(function(e) { return '<span class="equip-item">' + e + '</span>'; }).join('') + '</div></div>' : '';

    var notesHtml = (pj.notes_mj && pj.notes_mj.length)
      ? '<div class="sheet-section"><div class="sheet-section-title">Notes MJ</div>'
        + pj.notes_mj.map(function(n) { return '<div class="sheet-note"><div class="note-titre">' + n.titre + '</div><div class="note-contenu">' + n.contenu + '</div></div>'; }).join('') + '</div>' : '';

    function traitSec(title, val) {
      if (!val) return '';
      return '<div class="sheet-section"><div class="sheet-section-title">' + title + '</div><div class="sheet-trait">' + val + '</div></div>';
    }

    var infoRows = [];
    if (pj.langues) infoRows.push({ k: 'Langues', v: pj.langues });
    if (pj.maitrise_armures) infoRows.push({ k: 'Armures', v: pj.maitrise_armures });
    if (pj.maitrise_armes) infoRows.push({ k: 'Armes', v: pj.maitrise_armes });
    if (pj.maitrise_outils) infoRows.push({ k: 'Outils', v: pj.maitrise_outils });
    if (pj.sens_speciaux) infoRows.push({ k: 'Sens sp\u00e9ciaux', v: pj.sens_speciaux });
    var infoHtml = infoRows.length ? '<div class="sheet-section"><div class="sheet-section-title">Ma\u00eettrises &amp; Langues</div>'
      + infoRows.map(function(it) { return '<div class="sheet-kv"><span class="sheet-kv-k">' + it.k + '</span><span class="sheet-kv-v">' + it.v + '</span></div>'; }).join('') + '</div>' : '';

    var resistRows = [];
    if (pj.resistances) resistRows.push({ k: 'R\u00e9sistances', v: pj.resistances });
    if (pj.immunites) resistRows.push({ k: 'Immunit\u00e9s', v: pj.immunites });
    if (pj.vulnerabilites) resistRows.push({ k: 'Vuln\u00e9rabilit\u00e9s', v: pj.vulnerabilites });
    var resistHtml = resistRows.length ? '<div class="sheet-section"><div class="sheet-section-title">R\u00e9sistances &amp; Immunit\u00e9s</div>'
      + resistRows.map(function(it) { return '<div class="sheet-kv"><span class="sheet-kv-k">' + it.k + '</span><span class="sheet-kv-v">' + it.v + '</span></div>'; }).join('') + '</div>' : '';

    var physFields = [];
    if (pj.age) physFields.push({ k: 'Age', v: pj.age });
    if (pj.taille) physFields.push({ k: 'Taille', v: pj.taille + ' cm' });
    if (pj.poids) physFields.push({ k: 'Poids', v: pj.poids + ' kg' });
    if (pj.yeux) physFields.push({ k: 'Yeux', v: pj.yeux });
    if (pj.peau) physFields.push({ k: 'Peau', v: pj.peau });
    if (pj.cheveux) physFields.push({ k: 'Cheveux', v: pj.cheveux });
    var physHtml = physFields.length ? '<div class="sheet-section"><div class="sheet-section-title">Caract\u00e9ristiques physiques</div><div class="sheet-mini-grid">'
      + physFields.map(function(it) { return '<div class="sheet-mini-item"><span class="k">' + it.k + '</span><span class="v">' + it.v + '</span></div>'; }).join('') + '</div></div>' : '';

    return actBar
      + '<div class="sheet-content-inner">'
      + heroBand + statGroups
      + '<div class="sheet-body">'
      +   '<div class="sheet-col-left">'
      +     '<div class="sheet-section"><div class="sheet-section-title">Jets de Sauvegarde</div><div class="sheet-saves">' + savesHtml + '</div></div>'
      +     '<div class="sheet-section"><div class="sheet-section-title">Comp\u00e9tences</div><div class="sheet-skills">' + skillsHtml + '</div>' + legend + '</div>'
      +     bmPp + moneyHtml

      +   '<div class="sheet-col-right">'
      +     attacksHtml + capsHtml + passifsHtml + sortsDndHtml + actionsHtml + equipHtml + notesHtml

      +     traitSec('Id\u00e9aux', pj.ideaux)
      +     traitSec('Liens', pj.liens)
      +     traitSec('D\u00e9fauts', pj.defauts)
      +     traitSec('Avantage du background', pj.background_feature)
      +     traitSec('Histoire', pj.histoire)
      +     infoHtml + resistHtml + physHtml
      +   '</div>'
      + '</div>'
      + '</div>';
  }
  var allPjs = [];
  var currentSheetIdx = -1;

  window.closeSheet = function() {
    document.getElementById('sheet-overlay').classList.remove('open');
    document.body.style.overflow = '';
  };

  window.adjustPVTemp = function(delta) {
    var pj = allPjs[currentSheetIdx];
    if (!pj) return;
    var cur = parseInt(pj.pv_temporaires) || 0;
    cur = Math.max(0, cur + delta);
    pj.pv_temporaires = cur;
    var el = document.getElementById('sh-pvt-cur');
    if (el) el.textContent = cur > 0 ? cur : '\u2014';
  };
  window.toggleInspiration = function() {
    var pj = allPjs[currentSheetIdx];
    if (!pj) return;
    pj.inspiration = !pj.inspiration;
    var el = document.querySelector('#sheet-overlay .sheet-insp');
    if (!el) return;
    el.className = 'sheet-insp ' + (pj.inspiration ? 'active' : 'inactive');
    el.textContent = pj.inspiration ? '\u2605 Inspiration' : '\u25cb Inspiration';
  };
  window.toggleCap = function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var open = el.classList.toggle('open');
    var svg = el.querySelector('.cap2-head svg');
    if (svg) svg.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
  };

  window.adjustHP = function(delta) {
    var pj = allPjs[currentSheetIdx];
    if (!pj) return;
    var cur = parseInt(pj.pv_actuels != null ? pj.pv_actuels : pj.pv) || 0;
    var max = parseInt(pj.pv_max) || cur || 1;
    cur = Math.max(0, Math.min(max, cur + delta));
    pj.pv_actuels = cur;
    var elV = document.getElementById('sh-pv-cur');
    if (elV) elV.textContent = cur;
    var pct = Math.min(100, Math.round(cur / max * 100));
    var bar = document.getElementById('sh-pv-bar');
    if (bar) { bar.style.width = pct + '%'; bar.className = 'hp3-fill' + hpFill(pct); }
    var cardEl = document.querySelector('[data-idx="' + currentSheetIdx + '"]');
    if (cardEl) {
      var cardBar = cardEl.querySelector('.hp-fill');
      var cardVal = cardEl.querySelector('.hp-value strong');
      if (cardBar) { cardBar.style.width = pct + '%'; cardBar.className = 'hp-fill' + hpFill(pct); }
      if (cardVal) cardVal.textContent = cur;
    }
  };

  window.openSheetNewTab = function() {
    var pj = allPjs[currentSheetIdx];
    if (!pj) return;
    var _cid = new URLSearchParams(location.search).get('c') || '';
    var _url = 'fiche.html?c=' + encodeURIComponent(_cid) + '&id=' + encodeURIComponent(pj.id || '');
    var w = window.open(_url, '_blank');
    if (!w) alert('Popup bloqu\u00e9. Autorisez les popups pour ce site.');
  };

  window.openSheet = function(idx) {
    currentSheetIdx = idx;
    var pj = allPjs[idx];
    if (!pj) return;
    document.getElementById('sheet-content').innerHTML = renderSheet(pj);
    document.getElementById('sheet-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    var _sfn=(pj.nom||'').replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_\-]/g,'').replace(/_+/g,'_');
    var _b5e=document.getElementById('sh-btn-pdf-5e');
    var _bw=document.getElementById('sh-btn-pdf-lite');
    if(_b5e) _b5e.onclick=function(){window.open('pdf/'+_sfn+'_dnd5e.pdf','_blank');};
    if(_bw) _bw.onclick=function(){window.open('pdf/'+_sfn+'_warden.pdf','_blank');};
    if(typeof window.qrcode==='function'&&window.location.protocol!=='file:'){
      var _cid2=new URLSearchParams(location.search).get('c')||'';
      var _qrUrl='fiche.html?c='+encodeURIComponent(_cid2)+'&id='+encodeURIComponent(pj.id||'');
      var _qr=window.qrcode(0,'M');
      _qr.addData(_qrUrl);_qr.make();
      var _diceEl=document.querySelector('.sheet-dice');
      if(_diceEl){var _qrW=document.createElement('div');_qrW.className='fiche-qr';_qrW.innerHTML='<div class="fiche-qr-lbl">Sur mobile</div><div id="sheet-qr-img">'+_qr.createSvgTag(3,0,'',true)+'</div>';_diceEl.parentNode.insertBefore(_qrW,_diceEl);}
    }
  };
  var mjMode = localStorage.getItem('sw_mj_mode') === 'true';

  // MJ mode gere par nav-v2.js - on ecoute les changements pour re-rendre
  document.addEventListener('larme-mj-change', function() {
    mjMode = localStorage.getItem('sw_mj_mode') === 'true';
    var grid = document.getElementById('cards-grid');
    if (grid && allPjs.length) { var displayPjs = allPjs.filter(function(pj){ return mjMode || pj.statut_campagne !== 'absent'; }); grid.innerHTML = displayPjs.map(function(pj) { return renderCard(pj, allPjs.indexOf(pj)); }).join(''); }
  });

  /* ── Load data ── */
  async function init() {
    var grid = document.getElementById('cards-grid');
    try {
      var data = await loadData('personnages.json');
      allPjs = Array.isArray(data) ? data : [];
      populateSpellbookSelect();
      if (!allPjs.length) { grid.innerHTML = '<div class="loading">Aucun aventurier trouv\u00e9.</div>'; return; }
      var displayPjs = allPjs.filter(function(pj){ return mjMode || pj.statut_campagne !== 'absent'; });
      grid.innerHTML = displayPjs.map(function(pj) { return renderCard(pj, allPjs.indexOf(pj)); }).join('');
      var actifs = allPjs.filter(function(p) { return p.statut_campagne !== 'absent'; }).length;
      var _ac = document.getElementById('active-count'); if(_ac) _ac.textContent = actifs + ' / ' + allPjs.length;
      var urlP = new URLSearchParams(window.location.search); var ficheP = parseInt(urlP.get('fiche')); if (!isNaN(ficheP) && ficheP >= 0 && ficheP < allPjs.length) { openSheet(ficheP); }
    } catch(e) {
      console.error(e);
      grid.innerHTML = '<div class="loading">Erreur de chargement.</div>';
    }
  }


  function populateSpellbookSelect() {
    var sel = document.getElementById('sb-char-select');
    if (!sel) return;
    // Vider sauf l'option par defaut
    while (sel.options.length > 1) sel.remove(1);
    allPjs.forEach(function(pj) {
      var opt = document.createElement('option');
      opt.value = pj.nom || '';
      opt.textContent = pj.nom || 'Sans nom';
      sel.appendChild(opt);
    });
  }

  async function loadSession() {
    try {
      var c = await loadData('campaign.json');
      if (c && c.nom) {
        document.getElementById('camp-name').textContent = c.nom;
        if (c.session_num) {
          var s2 = 'Session ' + c.session_num;
          document.getElementById('camp-session').textContent = s2;
        }
      } else {
        document.getElementById('camp-name').textContent = 'La Larme d\'Argent';
      }
    } catch(e) {
      document.getElementById('camp-name').textContent = 'La Larme d\'Argent';
    }
  }

  init();
  loadSession();
})();
  function rollDie(n) {
    var r = Math.floor(Math.random() * n) + 1;
    var el = document.querySelector('.sheet-dice .dr-res');
    if (!el) return;
    el.textContent = r + ' / d' + n;
    el.classList.remove('dr-roll', 'dr-active');
    void el.offsetWidth;
    el.classList.add('dr-roll', 'dr-active');
    setTimeout(function(){ el.classList.remove('dr-roll'); }, 300);
  }
</script>
</body>
</html>
